<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Monc's Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0b1026; --ink:#f8fafc; --muted:#a5b4fc; --gold:#fde047; --card:rgba(15,23,42,.72);
  --line:rgba(255,255,255,.14); --accent:#a855f7;
  --fd:'Fredoka','Nunito',system-ui,sans-serif; --fb:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb)}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ===================== TV ===================== */
body.tv{overflow:hidden;background:#05071a}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(900px 500px at 15% -10%,rgba(168,85,247,.45),transparent 60%),
   radial-gradient(900px 600px at 95% 0%,rgba(59,130,246,.35),transparent 60%),
   radial-gradient(1200px 500px at 50% 120%,rgba(236,72,153,.35),transparent 60%),
   linear-gradient(180deg,#140b3a,#0b1026 60%,#120a2e)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.025) 120px 180px)}

#lobby,#game{position:absolute;inset:0}
#lobby{display:none}
.mode-lobby #lobby{display:block}
.mode-lobby #game{display:none}

#topbar{position:absolute;left:24px;right:24px;top:14px;height:76px;display:flex;align-items:center;gap:24px}
.logo{font-family:var(--fd);font-weight:700;font-size:38px;letter-spacing:.02em;
  background:linear-gradient(90deg,#fde047,#fb923c,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
#turninfo{flex:1;display:flex;gap:14px;align-items:center}
.turnpill{font-family:var(--fd);font-size:30px;padding:8px 22px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid var(--line)}
.turnpill b{color:var(--gold);font-size:36px}
.finalpill{font-family:var(--fd);font-size:24px;padding:10px 20px;border-radius:999px;background:linear-gradient(90deg,#dc2626,#f97316);animation:pulseb 1.2s infinite alternate}
@keyframes pulseb{to{transform:scale(1.04);box-shadow:0 0 30px rgba(249,115,22,.6)}}
.tb-right{display:flex;align-items:center;gap:12px;font-family:var(--fd);font-size:26px}
#roomtag{padding:6px 16px;border-radius:12px;background:rgba(255,255,255,.08)}
.conn{width:16px;height:16px;border-radius:50%;background:#f59e0b;display:inline-block}
.conn.ok{background:#22c55e;box-shadow:0 0 12px #22c55e}
.conn.bad{background:#f59e0b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.mini{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-size:26px}

#boardWrap{position:absolute;left:24px;top:104px;width:1380px;height:920px}
#board{width:1380px;height:920px;display:block;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.road{fill:none;stroke:#fef3c7;stroke-opacity:.9;stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
.road2{fill:none;stroke:#d6b98c;stroke-width:22;stroke-linecap:round;stroke-dasharray:2 14}
.arrow{fill:none;stroke:#78350f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.node .nshadow{fill:rgba(0,0,0,.35);transform:translateY(4px)}
.node .nbody{stroke:#fff;stroke-width:3.5}
.nlabel{font-family:var(--fd);font-weight:700;text-anchor:middle;dominant-baseline:central}
.t-B .nbody{fill:url(#none) #2563eb}
.cl1{font-family:var(--fd);font-weight:700;font-size:40px;fill:rgba(255,255,255,.16)}
.cl2{font-family:var(--fd);font-weight:700;font-size:58px;fill:rgba(255,255,255,.2)}
.token{transition:transform .28s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.pulse{fill:none;stroke-width:6;animation:pring 1s infinite}
@keyframes pring{from{r:24;opacity:1}to{r:44;opacity:0}}
.starmark{animation:bob 1.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px) scale(1.06)}}
.starmark text{dominant-baseline:auto}
.starprice{font-family:var(--fd);font-weight:700;font-size:17px;fill:#fde047;stroke:#0f172a;stroke-width:4px;paint-order:stroke}
.bankt{font-family:var(--fd);font-weight:700;font-size:17px;fill:#fde047}
.choicering{fill:rgba(253,224,71,.25);stroke:#fde047;stroke-width:5;animation:pring2 .8s infinite alternate}
@keyframes pring2{to{stroke-width:9}}
.choicetxt{font-family:var(--fd);font-weight:700;font-size:30px;fill:#fde047;stroke:#0f172a;stroke-width:6px;paint-order:stroke}

#dicebox{position:absolute;left:845px;top:500px;transform:translate(-50%,-50%);min-width:340px;padding:18px 26px 16px;border-radius:28px;
  background:rgba(15,23,42,.88);border:3px solid rgba(255,255,255,.2);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:popin .3s}
.dwho{font-family:var(--fd);font-size:28px;color:var(--pc);margin-bottom:10px}
.dice-row{display:flex;gap:18px;justify-content:center}
.die{width:130px;height:130px;border-radius:26px;background:linear-gradient(160deg,#fff,#e2e8f0);color:#0f172a;font-family:var(--fd);font-weight:700;font-size:78px;
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -8px 0 #cbd5e1,0 8px 0 #94a3b8}
.die.rolling{animation:shake .25s infinite}
.die.done{animation:popin .35s;background:linear-gradient(160deg,#fde047,#f59e0b);box-shadow:inset 0 -8px 0 #d97706,0 8px 0 #92400e}
@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.dhint{margin-top:14px;font-size:24px;color:#cbd5e1}
.dhint b{color:var(--gold);font-size:30px}

#side{position:absolute;left:1424px;top:104px;width:472px;height:700px}
#plist{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;align-items:center;gap:12px;height:78px;padding:0 14px;border-radius:18px;background:var(--card);border:2px solid var(--line);transition:all .3s}
.pcard.cur{border-color:var(--pc);box-shadow:0 0 0 3px var(--pc),0 0 30px color-mix(in srgb,var(--pc) 50%,transparent);transform:translateX(-10px)}
.pcard.off{opacity:.55}
.prank{font-family:var(--fd);font-size:24px;width:40px;color:#c7d2fe}
.pav,.lpav,.msav,.pbav,.vsav,.pav2{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff}
.pav{width:54px;height:54px;font-size:30px;flex:none}
.pinfo{flex:1;min-width:0}
.pname{font-family:var(--fd);font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offtag{font-size:14px;background:#475569;padding:2px 8px;border-radius:8px;vertical-align:middle}
.pitems{font-size:20px;letter-spacing:2px;height:26px}
.pitems .none{font-size:14px;color:#64748b;letter-spacing:0}
.pitems .deb{filter:grayscale(.2);opacity:.8;margin-left:4px;border-left:2px solid #475569;padding-left:6px}
.pstats{text-align:right;font-family:var(--fd)}
.pstar{font-size:28px;color:var(--gold)}
.pcoin{font-size:22px;color:#fef08a}

#host{position:absolute;left:1424px;top:812px;width:472px;height:252px;z-index:30;pointer-events:none}
.hostsvg{position:absolute;left:0;bottom:0;width:160px;height:176px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.4))}
.hostname{position:absolute;left:44px;bottom:-4px;font-family:var(--fd);font-size:18px;letter-spacing:.2em;color:#c4b5fd}
#bubble{position:absolute;left:150px;right:0;bottom:60px;max-height:236px;overflow:hidden;padding:16px 20px;border-radius:24px 24px 24px 6px;background:#fff;color:#1e1b4b;
  font-family:var(--fd);font-size:24px;line-height:1.25;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#bubble.pop{animation:popin .25s}
#host.talk .mouth{animation:talk .16s infinite alternate;transform-origin:100px 114px}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.9)}}
#host .ant{animation:antb 1.6s infinite}
@keyframes antb{50%{fill:#f472b6}}
#host.evil .hostsvg rect:first-of-type{fill:#7f1d1d}
#host.evil #bubble{background:#1f0a0a;color:#fecaca}
.mode-lobby #host{left:1440px;top:600px;width:440px;height:440px}
.mode-lobby #host .hostsvg{width:230px;height:253px}
.mode-lobby #bubble{left:30px;bottom:270px;font-size:28px}
.mode-lobby .hostname{left:70px}

#ov{position:absolute;inset:0;pointer-events:none;z-index:20}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40}
.floater{position:absolute;transform:translate(-50%,-50%);font-family:var(--fd);font-weight:700;font-size:40px;text-shadow:0 3px 0 #000,0 0 14px #000;animation:floatup 1.8s forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-20px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110px)}}
.banner{position:absolute;left:714px;top:126px;transform:translateX(-50%);display:flex;align-items:center;gap:22px;padding:20px 40px;min-width:640px;max-width:1300px;border-radius:28px;z-index:5;
  background:linear-gradient(135deg,#4c1d95,#1e3a8a);border:4px solid #fde047;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:bannerin .45s cubic-bezier(.2,1.6,.4,1)}
.banner.hot{background:linear-gradient(135deg,#991b1b,#c2410c)}
.banner.out{animation:bannerout .35s forwards}
@keyframes bannerin{from{transform:translateX(-50%) translateY(-60px) scale(.6);opacity:0}}
@keyframes bannerout{to{transform:translateX(-50%) translateY(-40px);opacity:0}}
.bemoji{font-size:70px}
.btitle{font-family:var(--fd);font-weight:700;font-size:44px;line-height:1.1}
.bsub{font-size:26px;color:#e0e7ff;margin-top:4px}

.panel{position:absolute;left:24px;top:104px;width:1380px;height:920px;border-radius:36px;pointer-events:auto;
  background:rgba(8,10,30,.93);backdrop-filter:blur(10px);border:3px solid rgba(255,255,255,.12);animation:fadein .3s}
.panel.center{display:flex;align-items:center;justify-content:center;text-align:center}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{transform:scale(.5);opacity:0}}

.intro{padding:40px}
.introT{font-family:var(--fd);font-weight:700;font-size:84px;background:linear-gradient(90deg,#fde047,#fb923c,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.introOrder{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:40px 0}
.io{display:flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.08);border:3px solid var(--pc);font-family:var(--fd);font-size:30px;animation:popin .4s both}
.io b{color:var(--gold)}
.io .lpav{width:50px;height:50px;font-size:28px}
.introRules{font-size:26px;color:#c7d2fe;max-width:1100px;margin:0 auto;line-height:1.6}

.starwin .sw-star{font-size:240px;animation:spinstar 1.2s cubic-bezier(.2,1.5,.4,1)}
@keyframes spinstar{from{transform:rotate(-360deg) scale(0)}}
.sw-t{font-family:var(--fd);font-weight:700;font-size:64px;color:var(--gold)}
.sw-s{font-size:32px;margin-top:10px}

.wheelbox{display:flex;flex-direction:column;align-items:center}
.wtitle{font-family:var(--fd);font-weight:700;font-size:56px;color:var(--gold);margin-bottom:6px}
.wwho{font-family:var(--fd);font-size:30px;margin-bottom:10px;color:#e0e7ff}
.wheelwrap{position:relative;width:580px;height:580px}
.wheel{width:580px;height:580px;filter:drop-shadow(0 16px 30px rgba(0,0,0,.6))}
.wtext{font-family:var(--fd);font-weight:600;font-size:19px;fill:#fff;stroke:rgba(0,0,0,.35);stroke-width:3px;paint-order:stroke}
.wcenter{font-family:var(--fd);font-size:34px;fill:#fde047}
.wpointer{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:70px;color:#fde047;text-shadow:0 4px 0 #000}
.wres{font-family:var(--fd);font-weight:700;font-size:48px;min-height:64px;margin-top:6px;color:#fff;animation:popin .3s}

.shopbox .shopgrid{display:grid;grid-template-columns:repeat(4,250px);gap:18px;margin-top:20px}
.shopit{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border-radius:22px;background:rgba(255,255,255,.07);border:2px solid var(--line);font-size:24px}
.si-e{font-size:60px}.si-p{font-family:var(--fd);color:var(--gold);font-size:26px}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px;width:1100px}
.vsp{font-family:var(--fd);font-size:46px;display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--pc)}
.vsav{width:180px;height:180px;font-size:110px;border-width:6px}
.vsx{font-family:var(--fd);font-weight:700;font-size:130px;color:#fde047;text-shadow:0 0 30px #f97316;animation:popin .6s}
.vsbet{grid-column:1/-1;font-family:var(--fd);font-size:40px;color:#fde68a}

/* quiz */
.quizpanel{padding:30px 40px}
.quiz{display:flex;flex-direction:column;height:100%}
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qhead>span{font-family:var(--fd);font-size:26px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.1)}
.qdyn{background:linear-gradient(90deg,#7c3aed,#db2777)!important}
.qtheme{background:color-mix(in srgb,var(--tc) 35%,transparent)!important;border:2px solid var(--tc)}
.qlv.lv-f{background:#166534!important}.qlv.lv-m{background:#a16207!important}.qlv.lv-d{background:#991b1b!important}
.qtext{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--fd);font-weight:600;font-size:56px;line-height:1.2;padding:10px 30px;animation:popin .35s}
.qtext.small{flex:0;font-size:38px;padding:20px 30px}
.read .qtext{font-size:64px}
.qtimer{height:18px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 18px}
.qtbar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opts.hiddenopts{visibility:hidden}
.opt{position:relative;display:flex;align-items:center;gap:20px;min-height:150px;padding:18px 26px;border-radius:24px;background:var(--oc);font-family:var(--fd);font-weight:600;font-size:36px;line-height:1.15;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.25);animation:popin .35s both;transition:all .4s}
.oshape{font-size:44px;width:56px;text-align:center;opacity:.9}
.otext{flex:1}
.owho{display:flex;gap:4px;flex-wrap:wrap;max-width:260px}
.ow{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #fff}
.opt.right{box-shadow:0 0 0 6px #fff,0 0 40px #fff;transform:scale(1.03)}
.opt.right::after{content:"✔";position:absolute;right:-14px;top:-14px;width:56px;height:56px;border-radius:50%;background:#16a34a;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:30px}
.opt.wrongopt{opacity:.28;filter:grayscale(.6)}
#answered{display:flex;gap:14px;justify-content:center;margin-top:18px;min-height:64px}
.ans{width:60px;height:60px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:32px;border:4px dashed rgba(255,255,255,.35);opacity:.45;transition:all .3s}
.ans.done{opacity:1;border:4px solid var(--pc);background:color-mix(in srgb,var(--pc) 40%,transparent);transform:scale(1.1)}
.ans.done.ok{box-shadow:0 0 0 4px #22c55e}
.ans.done.wrong{box-shadow:0 0 0 4px #ef4444;opacity:.7}
.numhint{text-align:center;font-size:32px;color:#c7d2fe;margin-bottom:20px}
.numans{text-align:center;font-family:var(--fd);font-size:44px;margin:10px 0 20px}
.numans b{color:var(--gold);font-size:64px}
.numrows,.rrows{display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto;width:100%}
.nr,.rr,.ms{display:grid;grid-template-columns:60px 60px 1fr auto auto;align-items:center;gap:16px;padding:10px 20px;border-radius:18px;background:rgba(255,255,255,.07);border-left:8px solid var(--pc);font-size:28px}
.nr{grid-template-columns:60px 1fr 180px 260px 80px}
.nr.best{background:rgba(253,224,71,.18);border:2px solid var(--gold);border-left:8px solid var(--pc)}
.nrv{font-family:var(--fd);font-size:34px;text-align:right}
.nrd{color:#c7d2fe;font-size:24px;text-align:right}
.nrp{font-family:var(--fd);color:#86efac;font-size:30px;text-align:right}
.msav{width:50px;height:50px;font-size:28px}

.dynintro{padding:40px}
.di-top{font-family:var(--fd);font-weight:700;font-size:54px;color:#f9a8d4;letter-spacing:.04em}
.di-e{font-size:170px;margin:10px 0;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.di-n{font-family:var(--fd);font-weight:700;font-size:96px;color:var(--gold);line-height:1}
.di-d{font-size:36px;margin-top:20px;color:#e0e7ff;max-width:1100px}
.di-r{font-size:24px;margin-top:30px;color:#a5b4fc}

.midscore,.results{width:1100px}
.minisc{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.ms{grid-template-columns:60px 60px 1fr auto}
.mspts{font-family:var(--fd);font-size:32px;color:var(--gold)}
.rr{grid-template-columns:70px 60px 1fr 200px 110px 300px;animation:slidein .5s both}
@keyframes slidein{from{transform:translateX(-60px);opacity:0}}
.rpl{font-family:var(--fd);font-size:36px;color:var(--gold)}
.rpts{color:#c7d2fe;text-align:right}
.rrew{font-family:var(--fd);color:#fef08a;font-size:32px;text-align:right}
.ritem{font-size:24px;color:#f0abfc;text-align:right}

.bonus .bo-e{font-size:180px}
.bo-n{font-family:var(--fd);font-weight:700;font-size:84px;color:var(--gold)}
.bo-d{font-size:34px;color:#e0e7ff}
.bo-w{margin-top:40px;font-family:var(--fd);font-size:54px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:center}
.bow1{display:inline-flex;align-items:center;gap:14px;color:var(--pc);animation:popin .5s}
.bow1 .msav{width:80px;height:80px;font-size:46px}
.bo-v{width:100%;font-size:30px;color:#a5b4fc}

.panel .final{width:1300px}
.fi-t{font-family:var(--fd);font-weight:700;font-size:70px;color:var(--gold)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:30px;margin:30px 0 20px;height:520px}
.pod{display:flex;flex-direction:column;align-items:center;width:320px;transition:all .6s cubic-bezier(.2,1.5,.4,1)}
.pod.hide{opacity:0;transform:translateY(60px) scale(.8)}
.pav2{width:130px;height:130px;font-size:80px;border-width:5px}
.pod1 .pav2{width:170px;height:170px;font-size:104px;box-shadow:0 0 50px #fde047}
.pn{font-family:var(--fd);font-weight:700;font-size:40px;margin-top:10px;color:var(--pc)}
.ps{font-size:28px;margin:6px 0 12px}
.pblock{width:100%;border-radius:20px 20px 0 0;background:linear-gradient(180deg,#a855f7,#6d28d9);font-family:var(--fd);font-weight:700;font-size:72px;display:flex;align-items:center;justify-content:center}
.pod1 .pblock{height:230px;background:linear-gradient(180deg,#fde047,#ca8a04);color:#422006}
.pod2 .pblock{height:160px;background:linear-gradient(180deg,#e2e8f0,#94a3b8);color:#1e293b}
.pod3 .pblock{height:110px;background:linear-gradient(180deg,#fdba74,#c2410c)}
.rest{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px;font-size:26px;color:#c7d2fe;margin-bottom:24px}

/* lobby */
.lob-left{position:absolute;left:60px;top:40px;width:680px;display:flex;flex-direction:column;align-items:center;text-align:center}

/* ===================== CELULAR ===================== */

button:disabled{opacity:.5}

.pq-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#a5b4fc;flex-wrap:wrap}

.pq-opts:has(.chosen) .pqo:not(.chosen){opacity:.35}
.splat{position:absolute;z-index:5;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 40% 40%,#1e1b2e 0 35%,#0b0b14 36% 55%,transparent 56%),radial-gradient(circle at 70% 65%,#0b0b14 0 22%,transparent 23%),radial-gradient(circle at 25% 75%,#0b0b14 0 16%,transparent 17%),radial-gradient(circle at 75% 25%,#0b0b14 0 14%,transparent 15%);
  transition:opacity .25s,transform .25s}

.inktip{text-align:center;color:#c4b5fd;font-size:15px;margin-top:8px}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:66px;border-radius:16px;border:none;background:rgba(255,255,255,.1);color:#fff;font-family:var(--fd);font-size:30px}
.key.ok{background:linear-gradient(180deg,#4ade80,#16a34a)}

.pres{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;border-radius:28px;padding:30px;animation:popin .35s}

/* ===== etapa 1: efeitos, bifurcações e preview ===== */
.coinfly{position:absolute;font-size:34px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));z-index:5}
.particle{position:absolute;font-size:30px;pointer-events:none}
.particle.ink{color:#0b0b14;font-size:40px;text-shadow:0 0 4px rgba(255,255,255,.4)}
.flash{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);animation:flashgrow 1s ease-out forwards}
.flash.ice{background:radial-gradient(circle,rgba(186,230,253,.95),rgba(56,189,248,.4) 50%,transparent 70%)}
.flash.ink{background:radial-gradient(circle,rgba(10,10,20,.95),rgba(10,10,20,.6) 50%,transparent 70%)}
.flash.shield{background:radial-gradient(circle,rgba(255,255,255,.9),rgba(34,211,238,.6) 45%,transparent 70%)}
.flash.boom{background:radial-gradient(circle,rgba(253,224,71,.95),rgba(239,68,68,.5) 50%,transparent 70%)}
@keyframes flashgrow{to{width:320px;height:320px;opacity:0}}
/* peões: escudo, gelo e tinta */
.token .shieldb{fill:rgba(34,211,238,.18);stroke:#67e8f9;stroke-width:3;display:none;animation:shieldpulse 1.4s ease-in-out infinite alternate}
.token.has-shield .shieldb{display:block}
@keyframes shieldpulse{from{stroke-opacity:.5}to{stroke-opacity:1;stroke-width:5}}
.token.shield-hit .shieldb{animation:shieldhit .7s forwards}
@keyframes shieldhit{50%{transform:scale(1.6);stroke-width:8}100%{transform:scale(2.2);opacity:0}}
.token .iceb{fill:rgba(186,230,253,.55);stroke:#e0f2fe;stroke-width:2.5;display:none}
.token.is-frozen .iceb{display:block}
.token .inkb{fill:#0b0b14;opacity:.85;display:none}
.token.is-inked .inkb{display:block}
/* cards laterais */
.pav{position:relative}
.shbadge{position:absolute;right:-12px;bottom:-10px;font-size:22px;filter:drop-shadow(0 0 6px #22d3ee)}
.pcard.shielded{box-shadow:inset 0 0 0 2px rgba(103,232,249,.7),0 0 18px rgba(34,211,238,.35)}
.pcard.frozen{background:linear-gradient(135deg,rgba(186,230,253,.28),rgba(15,23,42,.72) 60%);border-color:#7dd3fc}
.pcard.inked{background-image:radial-gradient(circle at 85% 30%,rgba(0,0,0,.75) 0 14%,transparent 15%),radial-gradient(circle at 75% 70%,rgba(0,0,0,.7) 0 9%,transparent 10%)}
.pcard.cur.shielded{box-shadow:0 0 0 3px var(--pc),0 0 26px rgba(34,211,238,.55)}
/* bifurcação */
.brpath{fill:none;stroke-width:16;stroke-linecap:round;stroke-dasharray:18 12;opacity:.9;animation:dashmove .8s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-30}}
.brtag circle{stroke:#fff;stroke-width:3}
.brtag text{font-family:var(--fd);font-weight:700;font-size:22px;fill:#0f172a;text-anchor:middle}
.ghostring{fill:none;stroke-width:5;stroke-dasharray:10 7;animation:spinring 2.5s linear infinite;transform-origin:0 0}
@keyframes spinring{to{transform:rotate(360deg)}}
.ghost{animation:ghostbob 1s ease-in-out infinite alternate}
@keyframes ghostbob{to{opacity:.75}}
.stepsbadge circle{fill:#fde047;stroke:#0f172a;stroke-width:4}
.stepsbadge text{font-family:var(--fd);font-weight:700;font-size:26px;fill:#0f172a;text-anchor:middle}
.legend-t{font-size:22px;margin-bottom:8px}
.legend{display:grid;grid-template-columns:40px 1fr;gap:2px 10px;align-items:center;text-align:left;padding:8px 12px;margin-top:6px;border-radius:14px;background:rgba(255,255,255,.06);border-left:8px solid var(--bc)}

#dicebox{max-width:560px}

<script>

// Níveis: f = fácil, m = médio, d = difícil
const THEMES = {
  esporte:        { name: 'Esporte',        emoji: '⚽', color: '#22c55e' },
  ciencia:        { name: 'Ciência',        emoji: '🔬', color: '#06b6d4' },

/* =========================================================================
   TRANSPORTE — Supabase Realtime (broadcast) ou BroadcastChannel local
   ========================================================================= */
function createTransport(room, onMsg, onStatus) {
  if (LOCAL || !window.supabase) {
    const bc = new BroadcastChannel('qp-' + room);
    bc.onmessage = e => onMsg(e.data);
    setTimeout(() => onStatus('ok'), 0);
    return { send: m => bc.postMessage(m) };
  }
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
    auth: { persistSession: false, autoRefreshToken: false },
    realtime: { params: { eventsPerSecond: 40 } },
  });
  let ch = null, okAt = 0, state = 'connecting';
  const join = () => {
    if (ch) sb.removeChannel(ch);
    ch = sb.channel('qp-' + room, { config: { broadcast: { self: false } } });
    ch.on('broadcast', { event: 'm' }, ({ payload }) => onMsg(payload));
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED') { state = 'ok'; okAt = Date.now(); onStatus('ok'); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') { state = 'err'; onStatus('err'); }
    });
  };
  join();
  let badSince = 0;
  setInterval(() => {   // vigia: se ficar fora por muito tempo, refaz a inscrição
    if (state === 'ok') { badSince = 0; return; }
    if (!badSince) badSince = Date.now();
    else if (Date.now() - badSince > 9000) { badSince = Date.now(); join(); }
  }, 3000);
  return { send: m => { try { ch && ch.send({ type: 'broadcast', event: 'm', payload: m }); } catch (e) { } } };
}

function collect(parts, makeUI, ms, onAnswer, ack = '✅ Resposta enviada!') {
  return new Promise(res => {
    const gid = ++GID, ans = {}; let finished = false, tm;
    const t0 = Date.now();
    const finish = () => {
      if (finished) return; finished = true; clearTimeout(tm);
      parts.forEach(p => { if (pending[p.id] && pending[p.id].gid === gid) delete pending[p.id]; });
      res(ans);
    };
    parts.forEach(p => {
      const ui = makeUI(p); ui._ms = ms; setUI(p, ui);
      pending[p.id] = {
        uid: p.ui.id, gid, ack, resolve: (a, el) => {
          if (finished) return;
          const t = typeof el === 'number' && el >= 0 && el <= ms + 2000 ? el : Date.now() - t0;
          ans[p.id] = { a, t: Math.min(ms, t) };
          const stop = onAnswer && onAnswer(p, ans[p.id], ans);
          if (stop || Object.keys(ans).length >= parts.length) finish();
        },
      };
    });
    tm = setTimeout(finish, ms + 700);

function dests(from, steps) {

    if (left === 0) { list.push({ end: node, ci }); return; }
    const nx = NODES[node].next;
    if (nx.length > 1 && ci == null) fb = node;
    nx.forEach((id, i) => walk(id, left - 1, ci == null && nx.length > 1 ? i : ci));
  };
  walk(from, steps, null);
  const seen = new Set();
  return { fb, list: list.filter(d => { const k = d.end + ':' + d.ci; if (seen.has(k)) return false; seen.add(k); return true; }) };
}

function coinFlight(from, to, count) {
  mFx('coinFlight', [from, to, count]);
  count = Math.max(1, Math.min(12, count | 0));
  const fx = $('#fx');
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div'); c.className = 'coinfly'; c.textContent = '🪙';
    c.style.left = from[0] + 'px'; c.style.top = from[1] + 'px'; fx.appendChild(c);
    const dx = to[0] - from[0], dy = to[1] - from[1], h = -110 - rnd(70), jx = (Math.random() - 0.5) * 50;
    const a = c.animate([
      { transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 },
      { transform: `translate(-50%,-50%) translate(${dx / 2 + jx}px,${dy / 2 + h}px) scale(1.25)`, opacity: 1, offset: 0.5 },
      { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.7)`, opacity: 1 },
    ], { duration: T(800), delay: T(i * 90), easing: 'ease-in-out', fill: 'forwards' });
    a.onfinish = () => { c.remove(); ((SFX._o && SFX._o.tick) || SFX.tick).call(SFX); };
  }
  return sleep(T(820 + count * 90));
}
function burst(xy, chars, n = 12, spread = 150, cls = '') {
  mFx('burst', [xy, chars, n, spread, cls]);
  const fx = $('#fx');
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'particle ' + cls;
    d.textContent = Array.isArray(chars) ? pick(chars) : chars;
    d.style.left = xy[0] + 'px'; d.style.top = xy[1] + 'px'; fx.appendChild(d);
    const ang = Math.random() * Math.PI * 2, dist = spread * (0.5 + Math.random() * 0.6);
    d.animate([
      { transform: 'translate(-50%,-50%) scale(.3) rotate(0deg)', opacity: 1 },
      { transform: `translate(-50%,-50%) translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist}px) scale(1.1) rotate(${rnd(360) - 180}deg)`, opacity: 0 },
    ], { duration: T(900 + rnd(400)), easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' }).onfinish = () => d.remove();
  }
}
function flash(xy, cls) {
  mFx('flash', [xy, cls]);
  const d = document.createElement('div'); d.className = 'flash ' + cls;
  d.style.left = xy[0] + 'px'; d.style.top = xy[1] + 'px';
  $('#fx').appendChild(d); setTimeout(() => d.remove(), T(1200));
}
// anima peões em arco (usado na troca de lugar)
function arcTokens(moves) {
  mFx('arc', [moves.map(m => ({ id: m.p.id, from: m.from, to: m.to }))]);
  moves.forEach(({ p, from, to }) => {
    const el = document.querySelector(`#tokens [data-p="${p.id}"]`); if (!el) return;
    const mx = (from[0] + to[0]) / 2, my = Math.min(from[1], to[1]) - 160;
    el.animate([
      { transform: `translate(${from[0]}px,${from[1]}px) scale(1)` },
      { transform: `translate(${mx}px,${my}px) scale(1.8)`, offset: 0.5 },
      { transform: `translate(${to[0]}px,${to[1]}px) scale(1)` },
    ], { duration: T(1100), easing: 'ease-in-out' });
  });
  return sleep(T(1100));
}

function tokenPos(p) {
  const same = G.players.filter(o => o.node === p.node);
  const i = same.indexOf(p), n = same.length, n0 = NODES[p.node];
  if (n <= 1) return [n0.x, n0.y - 4];
  const a = (i / n) * Math.PI * 2 - Math.PI / 2, r = 20;
  return [n0.x + Math.cos(a) * r, n0.y + Math.sin(a) * r];
}

async function startGame() {
  SFX.init();
  loadMap(G.map); buildBoardSVG();
  G.phase = 'intro';
  G.order = shuffle(G.players.map(p => p.id));
  G.players.forEach(p => { p.node = BOARD.start; p.coins = START_COINS; p.stars = 0; p.items = []; p.debuff = { ink: 0, freeze: 0 }; p.stats = { correct: 0, earned: 0, attacks: 0 }; });
  G.turn = 1; G.pIdx = 0; G.traps = {}; G.bank = 5;
  placeStar();
  stageMode('board'); renderSide(); scheduleSync();
  waitAll('🎬 O show vai começar!', LOOK());
  SFX.fanfare();
  overlay(`<div class="intro"><div class="introT">QUE COMECE O SHOW!</div>
    <div class="introOrder">${G.order.map((id, i) => { const p = P(id); return `<div class="io" style="--pc:${p.color};animation-delay:${i * 0.15}s"><b>${i + 1}º</b><span class="lpav" style="background:${p.color}">${p.emoji}</span>${esc(p.name)}</div>`; }).join('')}</div>
    <div class="introRules">🎲 Role o dado e ande · ⭐ Passou pela estrela? Compre por ${STAR_PRICE} moedas · 🎤 No fim de cada turno tem quiz · 🏆 Vence quem tiver mais estrelas</div></div>`, 'center');
  await say(`Boa noite, boa noite! Eu sou o Pixel, e este é o Monc's Show! Serão ${G.maxTurns} turnos. Passou pela estrela, pode comprar por ${STAR_PRICE} moedas. E no fim de cada turno: quiz! A ordem foi sorteada. Boa sorte!`, { wait: true });
  await sleep(T(1200));
  closeOverlay();
  G.phase = 'turns'; save();
  gameLoop();
}

async function gameLoop() {
  try {
    while (G.turn <= G.maxTurns) {
      if (G.phase === 'turns') {
        if (G.pIdx === 0) await turnIntro();
        while (G.pIdx < G.order.length) {
          save();
          const p = P(G.order[G.pIdx]);
          if (p) await playerTurn(p);
          G.pIdx++;
        }
        G.phase = 'quiz';
      }
      if (G.phase === 'quiz') {
        save();
        G.cur = null; renderSide();
        await quizRound();
        G.turn++; G.pIdx = 0; G.phase = 'turns';
      }
    }
    G.phase = 'final'; save();
    await finale();
  } catch (e) {
    console.error(e);
    banner('⚠️', 'Ops, deu um erro', String(e && e.message || e), 6000);
  }
}

async function turnIntro() {
  stageMode('board'); renderSide();
  if (G.turn === G.maxTurns - 2) {
    SFX.fanfare();
    const last = G.players.slice().sort((a, b) => rankOf(b) - rankOf(a))[0];
    banner('🔥', 'RETA FINAL!', 'Faltam 3 turnos: casas azuis e vermelhas valem o DOBRO', 3800, 'hot');
    await say(`Atenção! Começou a reta final! Faltam só três turnos, e as casas azuis e vermelhas agora valem o dobro! E pra apimentar, ${last.name}, que está em último, ganha dez moedas de incentivo!`, { wait: true });
    addCoins(last, 10);
    await sleep(T(800));
  } else {
    if (G.turn > 1) await comebackBonus();
    banner('🎲', `TURNO ${G.turn} DE ${G.maxTurns}`, G.turn === G.maxTurns ? 'Último turno!' : '', 1800);
    await say(G.turn === G.maxTurns ? 'Último turno! É agora ou nunca!' : pick([`Turno ${G.turn}! Vamos nessa!`, `Começando o turno ${G.turn}!`, `Turno ${G.turn}. Quem vai brilhar?`]));
  }
}

async function comebackBonus() {
  const n = G.players.length; if (n < 2) return;
  const byRank = G.players.slice().sort((a, b) => rankOf(b) - rankOf(a));
  const ps = byRank.slice(0, n >= 4 ? 2 : 1).filter(p => rankOf(p) > 1);
  if (!ps.length) return;
  ps.forEach(p => addCoins(p, 3));
  await say(`Ajudinha da produção: ${ps.map(p => p.name).join(' e ')} ${ps.length > 1 ? 'ganham' : 'ganha'} três moedas pra correr atrás!`);
}

const usableItems = p => [...new Set(p.items)].filter(k => !ITEMS[k].passive && !(k === 'trap' && G.traps[p.node] !== undefined));

async function playerTurn(p) {
  G.cur = p.id; stageMode('board'); renderSide();
  waitAll(`${p.emoji} Vez de ${p.name}`, G.online ? 'Acompanhe no tabuleiro' : 'Acompanhe na TV', p);
  say(pick([`Vez de ${p.name}! Capricha nesse dado!`, `${p.name}, o tabuleiro é todo seu!`, `Bora, ${p.name}! Mostra quem manda!`, `${p.name}, sua vez! Sem pressão... mas todo mundo tá olhando.`]));
  let used = false, dice = 1, fixed = null;
  diceIdle(p, 1);
  for (;;) {
    const r = await ask(p, { screen: 'turn', items: used ? [] : usableItems(p), dice }, T(60000), { a: 'roll' }, '🎲 Rolando…');
    if (!r || r.a === 'roll') break;
    if (r.a === 'item' && !used && p.items.includes(r.k)) {
      diceHide();
      const res = await useItem(p, r.k);
      if (res === false) { diceIdle(p, dice); continue; }
      used = true; renderSide();
      if (res && res.fixed) { fixed = res.fixed; break; }
      if (res && res.dice) dice = res.dice;
      diceIdle(p, dice);
    }
  }
  const rolls = fixed ? [fixed] : Array.from({ length: dice }, () => 1 + rnd(10));
  const total = rolls.reduce((a, b) => a + b, 0);
  waitUI(p, `🎲 Você tirou ${total}!`, 'Andando…');
  await diceResult(rolls, !!fixed);
  say(total >= 9 ? pick([`${total}! Que dadada!`, `Uau, ${total} casas!`]) : total <= 2 ? pick([`Só ${total}... devagar e sempre.`, `${total}? Ai, ai, ai.`]) : `${total} casas!`);
  await move(p, total);
  diceHide();
  await land(p);

}

/* ---------- dado ---------- */
let diceTimer = null;
function diceIdle(p, n) {

  placeDice(p);
  db.innerHTML = `<div class="dwho" style="--pc:${p.color}">${p.emoji} ${esc(p.name)}</div><div class="dice-row">${Array.from({ length: n }, () => `<div class="die rolling">?</div>`).join('')}</div><div class="dhint">👆 Toque em <b>ROLAR</b> no celular</div>`;
  clearInterval(diceTimer);
  diceTimer = setInterval(() => { db.querySelectorAll('.die.rolling').forEach(d => d.textContent = 1 + rnd(10)); }, 90);
}
async function diceResult(rolls, fixed) {
  const db = $('#dicebox'); clearInterval(diceTimer);
  for (let i = 0; i < 10; i++) { db.querySelectorAll('.die').forEach(d => d.textContent = 1 + rnd(10)); SFX.dice(); await sleep(T(fixed ? 30 : 70)); }
  const dies = db.querySelectorAll('.die');

function diceSteps(n) { const h = $('#dicebox .dhint'); if (h) h.innerHTML = `Faltam <b>${n}</b> casa${n === 1 ? '' : 's'}`; }
function diceHide() { clearInterval(diceTimer); $('#dicebox').classList.add('hidden'); }

/* ---------- movimento ---------- */
function setPreview(p, left) { G.steps = left; G.preview = left > 0 ? dests(p.node, left) : null; renderBoard(); placeDice(p); }

// coloca a caixa do dado no espaço livre mais longe do jogador e das casas de destino
function placeDice(p) {
  const db = $('#dicebox'); if (!db || !p) return;
  const pts = [[NODES[p.node].x, NODES[p.node].y]];
  if (G.preview) { G.preview.list.forEach(d => pts.push([NODES[d.end].x, NODES[d.end].y])); if (G.preview.fb != null) pts.push([NODES[G.preview.fb].x, NODES[G.preview.fb].y]); }
  let best = MAP.dice[0], bd = -1;
  MAP.dice.forEach(sp => { const d = Math.min(...pts.map(q => Math.hypot(q[0] - sp[0], q[1] - sp[1]))); if (d > bd) { bd = d; best = sp; } });
  db.style.left = best[0] * BS + 'px'; db.style.top = best[1] * BS + 'px';
}

async function move(p, steps, extra) {
  let left = steps;
  setPreview(p, left);
  await sleep(T(extra ? 400 : 900));            // dá tempo de ver onde pode cair
  while (left > 0) {
    diceSteps(left);
    const node = NODES[p.node];
    let nx = node.next[0];
    if (node.next.length > 1) {
      const pv = dests(p.node, left);
      const opts = node.next.map((id, i) => ({
        id, color: BR_COLORS[i % BR_COLORS.length],
        label: BOARD.branch[node.id + '>' + id] || 'Seguir',
        land: [...new Set(pv.list.filter(d => d.ci === i).map(d => d.end))],
      }));
      branchLegend(opts, left);
      say(`${p.name}, escolha o caminho!`);
      const r = await ask(p, { screen: 'choose', title: '🔀 Escolha o caminho', sub: `Faltam ${left} casas · as cores são as mesmas da TV`,
        opts: opts.map((o, i) => ({ label: `${i + 1} · ${o.label}`, sub: 'Você cai em: ' + o.land.map(spaceDesc).join(' ou '), color: o.color })) },
        T(25000), { i: rnd(opts.length) }, '👍 Caminho escolhido');
      nx = (opts[r && r.i] || opts[0]).id;
      waitUI(p, '🚶 Andando…');
    }
    p.node = nx; left--;
    SFX.step(); setPreview(p, left);
    await sleep(T(340));
    if (p.node === G.star) { await offerStar(p, left === 0); if (left === 0) p._onStar = true; }
    else if (left > 0 && NODES[p.node].type === 'K') bankPass(p);
  }
  diceSteps(0);
  G.steps = 0; G.preview = null; renderBoard();
}

function branchLegend(opts, left) {
  const h = $('#dicebox .dhint'); if (!h) return;
  h.innerHTML = `<div class="legend-t">🔀 Escolha no celular · faltam <b>${left}</b></div>` + opts.map((o, i) =>
    `<div class="legend" style="--bc:${o.color}"><span class="lg-n">${i + 1}</span><span class="lg-l">${esc(o.label)}</span><span class="lg-d">🎯 ${o.land.map(spaceDesc).join(' / ')}</span></div>`).join('');
}

function bankPass(p) {
  const v = Math.min(2, p.coins);
  if (v > 0) { coinFlight(pXY(p), nXY(p.node), v); addCoins(p, -v); G.bank += v; renderBoard(); }
}

/* ---------- casas ---------- */
async function land(p, depth = 0) {
  const n = NODES[p.node];
  if (p._onStar) { delete p._onStar; return; }
  // armadilha
  const tr = G.traps[p.node];
  if (tr !== undefined && tr !== p.id) {
    const o = P(tr);
    delete G.traps[p.node]; renderBoard();
    if (o) {
      const v = Math.min(5, p.coins);
      SFX.lose();
      burst(pXY(p), ['🪤', '💥'], 10, 120); flash(pXY(p), 'boom');
      if (v) await coinFlight(pXY(p), pXY(o), v);
      addCoins(p, -v); addCoins(o, v);
      banner('🪤', `${p.name} caiu na armadilha de ${o.name}!`, `Pagou ${v} moedas`, 2400);
      await say(`Hahaha! ${p.name} caiu na armadilha de ${o.name}! Pagou ${v} moedas!`, { wait: true });
    }
  }
  const mult = finalStretch() ? 2 : 1;
  switch (n.type) {
    case 'B': {
      addCoins(p, 3 * mult);
      await say(pick([`Casa azul! ${p.name} ganhou ${3 * mult} moedas!`, `Moedinhas pra ${p.name}!`]));
      break;
    }
    case 'R': {
      const d = addCoins(p, -3 * mult);
      await say(d ? pick([`Casa vermelha! ${p.name} perdeu ${-d} moedas!`, `Ihh, casa vermelha. Que fase, ${p.name}!`]) : `Casa vermelha, mas ${p.name} já estava liso!`);
      break;
    }
    case 'E': await roulette(p); break;
    case 'D': await duel(p); break;
    case 'G': {
      const k = randomItemFor(p);
      SFX.pop();
      const ok = giveItem(p, k);
      banner('🎁', `${p.name} ganhou um presente!`, ok ? `${ITEMS[k].e} ${ITEMS[k].n}` : 'Mochila cheia: virou 3 moedas', 2400);
      await say(ok ? `Presente! ${p.name} ganhou: ${ITEMS[k].n}!` : `Presente! Mas a mochila de ${p.name} tá cheia. Leva três moedas!`, { wait: true });
      break;
    }
    case 'S2': await shop(p); break;
    case 'K': {
      const v = G.bank; if (v) await coinFlight(nXY(p.node), pXY(p), v); G.bank = 0; renderBoard();
      SFX.fanfare();
      addCoins(p, v);
      banner('🏦', `${p.name} caiu no banco!`, `Levou o acumulado: ${v} moedas`, 2600);
      await say(`Caiu no banco! ${p.name} leva tudo: ${v} moedas!`, { wait: true });
      break;
    }
    case 'V': await villain(p); break;
    case 'T': await thief(p); break;
    case 'I': await iceSlide(p, depth); break;
    case 'C': await cableCar(p); break;
    case 'A': await avalanche(p); break;
    case 'F': {
      const d = addCoins(p, -6 * mult); burst(pXY(p), ['🔥', '🔥', '💥'], 14, 140); flash(pXY(p), 'boom');
      await say(d ? `Lava! ${p.name} queimou ${-d} moedas!` : `Lava! Ainda bem que ${p.name} não tinha moedas pra queimar.`, { wait: true });
      break;
    }
    case 'Y': await geyser(p, depth); break;
    case 'Z': await eruption(p); break;
    default: break;
  }
}

async function roulette(p) {
  const outs = [
    { l: '+6 moedas', e: '💰' }, { l: '−4 moedas', e: '💸' }, { l: 'Ganhe um item', e: '🎁' }, { l: 'Teleporte!', e: '🌀' },
    { l: 'Cada um te dá 2', e: '🤑' }, { l: 'Pergunta bônus', e: '❔' }, { l: 'Você dá 1 a cada um', e: '🎅' }, { l: '+3 moedas', e: '🪙' },
  ];
  const idx = rnd(outs.length);
  await spinWheel('🎡 ROLETA DA SORTE', outs.map(o => o.e + ' ' + o.l), idx, `${p.emoji} ${esc(p.name)}`);
  const o = outs[idx];
  closeOverlay();
  switch (idx) {
    case 0: addCoins(p, 6); await say(`Seis moedas pra ${p.name}!`, { wait: true }); break;
    case 1: addCoins(p, -4); await say(`Ai! ${p.name} perdeu quatro moedas!`, { wait: true }); break;
    case 2: { const k = randomItemFor(p); const ok = giveItem(p, k); SFX.pop(); banner(ITEMS[k].e, ok ? `${p.name} ganhou ${ITEMS[k].n}` : 'Mochila cheia: +3 moedas', '', 2000); await say(ok ? `${p.name} ganhou ${ITEMS[k].n}!` : `Mochila cheia! Três moedas então.`, { wait: true }); break; }
    case 3: {
      const dest = pick(NODES.filter(n => n.id !== p.node && n.id !== G.star)).id;
      SFX.whoosh(); p.node = dest; renderBoard();
      await say(`Teleporte! ${p.name} foi parar do outro lado do tabuleiro!`, { wait: true });
      break;
    }
    case 4: {
      let tot = 0; const fl = []; others(p).forEach(x => { const v = Math.min(2, x.coins); if (v) fl.push(coinFlight(pXY(x), pXY(p), v)); addCoins(x, -v, true); tot += v; }); await Promise.all(fl);
      addCoins(p, tot);
      await say(`Todo mundo paga duas moedas pra ${p.name}! Dói no bolso, né?`, { wait: true }); break;
    }
    case 5: {
      const q = drawQ(randTheme(), 'm');
      say(`Pergunta bônus pra ${p.name}! Acertou, leva oito moedas!`);
      const ans = await soloQuestion(p, q, '❔ Pergunta bônus (+8)');
      if (ans) { addCoins(p, 8); await say(`Acertou! Oito moedas!`, { wait: true }); }
      else { await say(`Errou! Fica pra próxima.`, { wait: true }); }
      break;
    }
    case 6: {
      others(p).forEach(x => { if (p.coins > 0) { addCoins(p, -1, true); addCoins(x, 1, true); } });
      SFX.lose(); renderSide();
      await say(`Espírito natalino! ${p.name} dá uma moeda pra cada jogador!`, { wait: true }); break;
    }
    case 7: addCoins(p, 3); await say(`Três moedinhas pra ${p.name}!`, { wait: true }); break;
  }
}

function spinWheel(title, labels, idx, who) {
  const n = labels.length, seg = 360 / n;
  const cols = ['#f43f5e', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#06b6d4', '#ec4899', '#84cc16'];
  const R = 250;
  const slices = labels.map((l, i) => {
    const a0 = (i * seg - 90) * Math.PI / 180, a1 = ((i + 1) * seg - 90) * Math.PI / 180;
    const x0 = Math.cos(a0) * R, y0 = Math.sin(a0) * R, x1 = Math.cos(a1) * R, y1 = Math.sin(a1) * R;
    const am = (i + 0.5) * seg;
    return `<path d="M0,0 L${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} Z" fill="${cols[i % cols.length]}" stroke="#fff" stroke-width="3"/>
      <text transform="rotate(${am}) translate(0,${-R + 28}) rotate(90)" class="wtext" text-anchor="start" dy="7">${esc(l)}</text>`;
  }).join('');
  overlay(`<div class="wheelbox"><div class="wtitle">${title}</div>${who ? `<div class="wwho">${who}</div>` : ''}
    <div class="wheelwrap"><svg viewBox="-270 -270 540 540" class="wheel"><g id="wheelG" data-keep="style">${slices}</g><circle r="38" fill="#0f172a" stroke="#fde047" stroke-width="6"/><text class="wcenter" text-anchor="middle" dy="10">?</text></svg>
    <div class="wpointer">▼</div></div><div id="wres" class="wres"></div></div>`, 'center');
  const g = $('#wheelG');
  const final = 360 * 6 + (360 - (idx * seg + seg / 2)) + (Math.random() - 0.5) * seg * 0.5;
  g.style.transition = `transform ${T(3600)}ms cubic-bezier(.12,.75,.12,1)`;
  let ticks = 0; const ti = setInterval(() => { if (ticks++ < 25) SFX.tick(); else clearInterval(ti); }, T(120));
  requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transform = `rotate(${final}deg)`; mFx('wheel', [final, T(3600)]); }));
  return sleep(T(3800)).then(async () => {
    clearInterval(ti); SFX.pop();
    const r = $('#wres'); if (r) r.textContent = labels[idx];
    await sleep(T(1300));
  });
}

async function shop(p) {

async function iceSlide(p, depth) {
  if (depth > 0) { await say('Gelo de novo, mas dessa vez deu pra frear!'); return; }
  const k = 1 + rnd(3);
  SFX.whoosh(); burst(pXY(p), ['❄️', '💨'], 10, 110);
  banner('🧊', `${p.name} escorregou no gelo!`, `Desliza mais ${k} casa${k > 1 ? 's' : ''}`, 1800);
  await say(`Escorregou! ${p.name} desliza mais ${k} ${k > 1 ? 'casas' : 'casa'}!`);
  await move(p, k, true);
  await land(p, depth + 1);
}
async function geyser(p, depth) {
  if (depth > 0) { await say('O gêiser está recarregando...'); return; }
  SFX.whoosh(); burst(pXY(p), ['💨', '💧', '💦'], 16, 160); flash(pXY(p), 'ice');
  banner('💨', `Gêiser! ${p.name} foi lançado!`, 'Avança 4 casas', 1800);
  await say(`Gêiser! ${p.name} voa quatro casas pra frente!`);
  await move(p, 4, true);
  await land(p, depth + 1);
}
async function cableCar(p) {
  const other = NODES.find(n => n.type === 'C' && n.id !== p.node);
  if (!other) return;
  if (p.coins < 5) { await say(`Teleférico! Mas a passagem custa cinco moedas, e ${p.name} está sem dinheiro.`, { wait: true }); return; }
  say(`Teleférico! ${p.name}, quer pagar cinco moedas para ir até a outra estação?`);
  const r = await ask(p, { screen: 'choose', title: '🚡 Pegar o teleférico por 5 🪙?', sub: 'Leva você direto para a outra estação do mapa', opts: [{ label: '🚡 Sim, partiu!' }, { label: 'Não, fico aqui' }] }, T(20000), { i: 1 }, '🚡');
  if (!r || r.i !== 0) { await say(`${p.name} preferiu ir a pé.`); return; }
  addCoins(p, -5);
  const from = tokenPos(p); p.node = other.id; renderBoard();
  await arcTokens([{ p, from, to: tokenPos(p) }]);
  burst(pXY(p), '✨', 10, 100);
  await say(`Lá vai ${p.name} pelo teleférico!`, { wait: true });
}
function stepBack(node, k) { let n = node; for (let i = 0; i < k; i++) { const pv = NODES[n].prev; if (!pv.length) break; n = pv[0]; } return n; }
async function avalanche(p) {
  SFX.evil(); flash(pXY(p), 'ice'); burst(pXY(p), ['❄️', '🏔️', '💨'], 22, 260);
  const hit = others(p).filter(o => Math.hypot(NODES[o.node].x - NODES[p.node].x, NODES[o.node].y - NODES[p.node].y) < 260);
  if (!hit.length) { await say(`Avalanche! Mas não tinha ninguém por perto. Sorte de todo mundo!`, { wait: true }); return; }
  banner('🏔️', 'AVALANCHE!', `${hit.map(o => o.name).join(', ')} ${hit.length > 1 ? 'voltam' : 'volta'} 3 casas`, 2400, 'hot');
  const moves = hit.map(o => { const from = tokenPos(o); o.node = stepBack(o.node, 3); return { p: o, from }; });
  renderBoard();
  await arcTokens(moves.map(m => ({ ...m, to: tokenPos(m.p) })));
  await say(`Avalanche! ${hit.map(o => o.name).join(' e ')} ${hit.length > 1 ? 'foram arrastados' : 'foi arrastado'} três casas pra trás!`, { wait: true });
}
async function eruption(p) {
  SFX.evil(); flash(pXY(p), 'boom'); burst(pXY(p), ['🔥', '🪨', '💥'], 22, 260);
  const os = others(p); if (!os.length) return;
  const v = pick(os);
  let n = v.node, guard = 0;
  while (!NODES[n].j && NODES[n].prev.length && guard++ < 30) n = NODES[n].prev[0];
  banner('🌋', 'ERUPÇÃO!', `${v.name} volta para o começo do trecho`, 2400, 'hot');
  await say(`Erupção! Uma pedra de lava acertou ${v.name}, que volta para o começo do trecho!`);
  const from = tokenPos(v); v.node = n; renderBoard();
  await arcTokens([{ p: v, from, to: tokenPos(v) }]);
  burst(pXY(v), ['🔥', '💥'], 10, 100);
  await sleep(T(600));
}

async function thief(p) {
  SFX.evil();
  const targets = others(p).filter(o => o.stars > 0);

      await say(`Ele afanou ${v} moedas de ${lead.name} e deu pra ${p.name}!`, { wait: true });
    }

  }
  say(`${p.name}, quer pagar ${STEAL_PRICE} moedas para roubar uma estrela? Escolha a vítima!`);

  const v = r && r.id && P(r.id);
  if (!v || !targets.includes(v)) { await say(`${p.name} desistiu do roubo. A consciência falou mais alto!`, { wait: true }); return; }
  await coinFlight(pXY(p), nXY(p.node), 10);
  addCoins(p, -STEAL_PRICE, true);
  // estrela voando da vítima para o ladrão

    }
    switch (k) {
      case 'ink': SFX.whoosh(); burst(pXY(v), ['●', '●', '💧'], 18, 160, 'ink'); flash(pXY(v), 'ink'); v.debuff.ink = 3; renderSide(); banner('🦑', `${p.name} jogou tinta em ${v.name}!`, 'A tela vai ficar manchada no próximo quiz', 2600); await say(`Splash! ${p.name} jogou tinta em ${v.name}! Boa sorte enxergando as respostas!`, { wait: true }); break;
      case 'freeze': SFX.whoosh(); burst(pXY(v), ['❄️', '❄️', '🧊', '✨'], 18, 170); flash(pXY(v), 'ice'); v.debuff.freeze = 3; renderSide(); banner('🧊', `${p.name} congelou ${v.name}!`, '3 segundos travado no próximo quiz', 2600); await say(`Brrr! ${v.name} foi congelado por ${p.name}! Vai começar o quiz atrasado!`, { wait: true }); break;
      case 'hook': { const amt = Math.min(rankOf(v) === 1 ? 10 : 6, v.coins); burst(pXY(v), '🪝', 1, 10); if (amt) await coinFlight(pXY(v), pXY(p), amt); addCoins(v, -amt); addCoins(p, amt); banner('🪝', `${p.name} fisgou ${amt} moedas de ${v.name}!`, '', 2400); await say(`Gancho! ${p.name} roubou ${amt} moedas de ${v.name}!`, { wait: true }); break; }
      case 'swap': { const fp = tokenPos(p), fv = tokenPos(v); const a = p.node; p.node = v.node; v.node = a; SFX.whoosh(); renderBoard(); await arcTokens([{ p, from: fp, to: tokenPos(p) }, { p: v, from: fv, to: tokenPos(v) }]); burst(pXY(p), '✨', 8, 90); burst(pXY(v), '✨', 8, 90); banner('🔄', `${p.name} trocou de lugar com ${v.name}!`, '', 2400); await say(`Troca-troca! ${p.name} e ${v.name} trocaram de lugar!`, { wait: true }); break; }
    }
    renderSide(); return true;
  }

    if (G.traps[p.node] !== undefined) return false;
    removeItem(p, k); G.traps[p.node] = p.id; p.stats.attacks++; renderBoard(); burst(pXY(p), ['🪤', '✨'], 8, 90);
    banner('🪤', `${p.name} armou uma armadilha!`, 'Quem cair nessa casa paga 5 moedas', 2200);

  return false;
}

async function duelQuestion(a, b, q, n) {

/* =========================================================================
   QUIZ
   ========================================================================= */
function randTheme(avoid) { return pick(Object.keys(QB).filter(t => t !== avoid)); }
function drawQ(theme, lv) {
  const key = theme + lv, bank = QB[theme][lv];
  let used = G.used[key] || [];
  if (used.length >= bank.length) used = [];
  const free = bank.map((_, i) => i).filter(i => !used.includes(i));
  const i = pick(free); used.push(i); G.used[key] = used;
  const [q, ...rest] = bank[i];
  const order = shuffle([0, 1, 2, 3]);
  return { q, th: theme, lv, opts: order.map(j => rest[j]), correct: order.indexOf(0) };
}
function drawNum() {
  if (G.usedNum.length >= NUMQ.length) G.usedNum = [];
  const free = NUMQ.map((_, i) => i).filter(i => !G.usedNum.includes(i));
  const i = pick(free); G.usedNum.push(i);
  const [q, a, unit] = NUMQ[i];
  return { q, a, unit };
}
function nextDyn() {
  if (!G.dynBag.length) {
    let bag = shuffle(Object.keys(DYNS));
    if (bag[0] === G.lastDyn) bag.push(bag.shift());
    G.dynBag = bag;
  }
  return G.dynBag.shift();
}
function qUI(p, q, dynLabel, n, tot, withFx = true) {
  const fx = withFx ? { freeze: p.debuff.freeze > 0 ? 3000 : 0, ink: p.debuff.ink > 0 } : {};
  return { screen: 'q', q: q.q, opts: q.opts, th: q.th, lv: q.lv, dyn: dynLabel, n, tot, fx };
}
function resultUI(q, a, extra) {
  const ok = a && a.a.i === q.correct;
  return { screen: 'res', ok: !!ok, none: !a, msg: extra || (ok ? pick(['✅ Acertou!', '✅ Mandou bem!', '✅ Na mosca!']) : a ? '❌ Errou!' : '⏰ Não respondeu'), sub: `Resposta: ${q.opts[q.correct]}` };
}

function markAnswered(p, wrong) {
  const el = document.querySelector(`#answered [data-p="${p.id}"]`);
  if (el) { el.classList.add('done'); if (wrong) el.classList.add('wrong'); }
}

function renderQuestionTV(q, s) {
  const th = THEMES[q.th];
  const parts = s.parts || [];
  const head = `<div class="qhead"><span class="qdyn">${s.dyn}</span><span class="qnum">Pergunta ${s.n} de ${s.tot}</span>
    <span class="qtheme" style="--tc:${th.color}">${th.emoji} ${th.name}</span><span class="qlv lv-${q.lv}">${LEVEL_NAME[q.lv]}</span></div>`;
  const optsHTML = q.opts.map((o, i) => {
    let who = '';
    if (s.phase === 'reveal' && s.ans) who = parts.filter(p => s.ans[p.id] && s.ans[p.id].a.i === i).map(p => `<span class="ow" style="background:${p.color}">${p.emoji}</span>`).join('');
    const cls = s.phase === 'reveal' ? (i === q.correct ? 'right' : 'wrongopt') : '';
    return `<div class="opt ${cls}" style="--oc:${OPT_COLORS[i]};animation-delay:${i * 0.08}s"><span class="oshape">${OPT_SHAPES[i]}</span><span class="otext">${esc(o)}</span><span class="owho">${who}</span></div>`;
  }).join('');
  const answered = `<div id="answered">${parts.map(p => {
    const a = s.ans && s.ans[p.id];
    const st = s.phase === 'reveal' ? (a && a.a.i === q.correct ? 'done ok' : 'done wrong') : '';
    return `<span data-p="${p.id}" class="ans ${st}" style="--pc:${p.color}">${p.emoji}</span>`;
  }).join('')}</div>`;
  const timer = s.phase === 'ask' ? `<div class="qtimer"><div class="qtbar" style="animation-duration:${s.lim}ms"></div></div>` : '<div class="qtimer"></div>';
  overlay(`<div class="quiz ${s.phase}">${head}<div class="qtext">${esc(q.q)}</div>${timer}
    <div class="opts ${s.phase === 'read' ? 'hiddenopts' : ''}">${optsHTML}</div>${answered}</div>`, 'quizpanel');
}

async function runChoiceQuestion(q, parts, n, tot, dynLabel, withFx) {
  renderQuestionTV(q, { dyn: dynLabel, n, tot, phase: 'read', parts });
  G.players.forEach(p => setUI(p, parts.includes(p) ? { screen: 'wait', msg: '👀 Leia a pergunta ' + SCR(), sub: q.q } : { screen: 'wait', msg: '💀 Você foi eliminado', sub: 'Torça (ou seque) pelos outros!' }));
  await say(q.q, { wait: true });
  await sleep(T(250));
  const lim = LIMIT[q.lv];
  renderQuestionTV(q, { dyn: dynLabel, n, tot, phase: 'ask', parts, lim });
  let ticker = setInterval(() => SFX.tick(), 1000);
  const ans = await collect(parts, p => qUI(p, q, dynLabel, n, tot, withFx), lim, p => { markAnswered(p); SFX.pop(); });
  clearInterval(ticker);
  if (withFx) parts.forEach(p => { if (p.debuff.ink > 0) p.debuff.ink--; if (p.debuff.freeze > 0) p.debuff.freeze--; });
  renderQuestionTV(q, { dyn: dynLabel, n, tot, phase: 'reveal', parts, ans });
  const okN = parts.filter(p => ans[p.id] && ans[p.id].a.i === q.correct);
  okN.length ? SFX.ok() : SFX.bad();
  parts.forEach(p => setUI(p, resultUI(q, ans[p.id])));
  const ansTxt = q.opts[q.correct];
  if (!okN.length) say(pick([`Ninguém acertou! A resposta era: ${ansTxt}.`, `Zero acertos! Era ${ansTxt}.`]));
  else if (okN.length === parts.length && parts.length > 1) say(pick([`Todo mundo acertou! Era ${ansTxt}.`, `Fácil demais! Todos acertaram.`]));
  else if (okN.length === 1 && parts.length > 2) say(`Só ${okN[0].name} acertou! Era ${ansTxt}.`);
  else say(`A resposta certa é: ${ansTxt}.`);
  await sleep(T(3300));
  return ans;
}

function renderScoresMini(sc, parts, dyn) {
  const list = rankRound(sc, parts, dyn);
  return `<div class="minisc">${list.map(x => `<div class="ms" style="--pc:${x.p.color}"><span>${x.place}º</span><span class="msav" style="background:${x.p.color}">${x.p.emoji}</span><b>${esc(x.p.name)}</b><span class="mspts">${dyn === 'speed' ? fmt(sc[x.p.id].pts) : sc[x.p.id].pts}${dyn === 'elim' && sc[x.p.id].out != null ? ' 💀' : ''}</span></div>`).join('')}</div>`;
}

function rankRound(sc, parts, dyn) {
  const key = p => { const s = sc[p.id]; return [dyn === 'elim' ? (s.out == null ? 1000 : s.out) : 0, s.pts, -s.time]; };
  const cmp = (a, b) => { const ka = key(a), kb = key(b); for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return kb[i] - ka[i]; return 0; };
  const sorted = parts.slice().sort(cmp);
  const out = []; let place = 1;
  sorted.forEach((p, i) => { if (i > 0 && cmp(sorted[i - 1], p) !== 0) place = i + 1; out.push({ p, place }); });
  return out;
}

async function quizRound() {
  stageMode('quiz');
  const dyn = nextDyn(); G.lastDyn = dyn;
  const D = DYNS[dyn], parts = G.players.slice();
  const sc = {}; parts.forEach(p => sc[p.id] = { pts: 0, time: 0, out: null });
  waitAll('🎤 Hora do quiz!', LOOK());
  SFX.fanfare();
  overlay(`<div class="dynintro"><div class="di-top">🎤 HORA DO QUIZ!</div><div class="di-e">${D.e}</div><div class="di-n">${D.n}</div><div class="di-d">${D.d}</div>
    <div class="di-r">Prêmios: 1º lugar ${REWARDS[0]} 🪙 + item à escolha · último lugar ganha um item surpresa</div></div>`, 'center');
  await say(pick([`Atenção, atenção! Hora do quiz! `, `Chegou a hora mais esperada: o quiz! `, `Larguem o dado e peguem o cérebro: hora do quiz! `]) + `Dinâmica: ${D.n}! ${D.d}`, { wait: true });
  await sleep(T(700));

  if (dyn === 'number') {
    for (let i = 0; i < 3; i++) await runNumberQuestion(drawNum(), parts, i + 1, 3, sc);
  } else {
    let theme = null;
    if (dyn === 'theme') {
      const keys = Object.keys(THEMES), idx = rnd(keys.length);
      await spinWheel('🎯 SORTEIO DO TEMA', keys.map(k => THEMES[k].emoji + ' ' + THEMES[k].name), idx);
      theme = keys[idx];
      await say(`O tema é: ${THEMES[theme].name}!`, { wait: true });
    }
    const lv = LEVELS[dyn]; let alive = parts.slice(), lastTh = null;
    for (let i = 0; i < lv.length; i++) {
      if (dyn === 'elim' && alive.length <= 1) break;
      const th = theme || randTheme(lastTh); lastTh = th;
      const q = drawQ(th, lv[i]);
      const ps = dyn === 'elim' ? alive : parts;
      const label = `${D.e} ${D.n}`;
      const ans = await runChoiceQuestion(q, ps, i + 1, lv.length, label, true);
      const lim = LIMIT[q.lv];
      const okP = ps.filter(p => ans[p.id] && ans[p.id].a.i === q.correct);
      ps.forEach(p => {
        const a = ans[p.id], ok = a && a.a.i === q.correct;
        if (ok) {
          p.stats.correct++;
          sc[p.id].pts += dyn === 'speed' ? 500 + Math.round(500 * Math.max(0, 1 - a.t / lim)) : 1;
          sc[p.id].time += a.t;
        }
      });
      if (dyn === 'elim') {
        if (okP.length) {
          const outNow = alive.filter(p => !okP.includes(p));
          outNow.forEach(p => sc[p.id].out = i);
          alive = okP;
          if (outNow.length) { SFX.lose(); banner('💀', `Eliminado${outNow.length > 1 ? 's' : ''}: ${outNow.map(p => p.name).join(', ')}`, `${alive.length} ainda na disputa`, 2000); await sleep(T(1200)); }
        } else { banner('😅', 'Ninguém acertou', 'Ninguém sai nessa rodada!', 1800); await sleep(T(1000)); }
      }
      overlay(`<div class="midscore"><div class="wtitle">${D.e} Parcial</div>${renderScoresMini(sc, parts, dyn)}</div>`, 'center');
      await sleep(T(i === lv.length - 1 ? 600 : 2200));
    }
  }
  await roundResults(dyn, sc, parts);
  G.players.forEach(p => { p.debuff.ink = 0; p.debuff.freeze = 0; });
  closeOverlay();
  stageMode('board'); renderSide();
}

async function runNumberQuestion(nq, parts, n, tot, sc) {
  const dynLabel = '🔢 Chute Numérico';
  const head = `<div class="qhead"><span class="qdyn">${dynLabel}</span><span class="qnum">Pergunta ${n} de ${tot}</span></div>`;
  overlay(`<div class="quiz read">${head}<div class="qtext">${esc(nq.q)}</div><div class="qtimer"></div><div class="numhint">Digite seu chute no celular!</div><div id="answered">${parts.map(p => `<span data-p="${p.id}" class="ans" style="--pc:${p.color}">${p.emoji}</span>`).join('')}</div></div>`, 'quizpanel');
  parts.forEach(p => setUI(p, { screen: 'wait', msg: '👀 Leia a pergunta ' + SCR(), sub: nq.q }));
  await say(nq.q, { wait: true });
  const lim = 25000;
  $('.quiz').classList.replace('read', 'ask');
  $('.qtimer').innerHTML = `<div class="qtbar" style="animation-duration:${lim}ms"></div>`;
  const ans = await collect(parts, () => ({ screen: 'num', q: nq.q, unit: nq.unit, n, tot, dyn: dynLabel }), lim, p => { markAnswered(p); SFX.pop(); });
  const rows = parts.map(p => ({ p, v: ans[p.id] ? Number(ans[p.id].a.v) : null, t: ans[p.id] ? ans[p.id].t : lim }))
    .map(r => ({ ...r, d: r.v == null || isNaN(r.v) ? Infinity : Math.abs(r.v - nq.a) }))
    .sort((a, b) => a.d - b.d || a.t - b.t);
  const answeredRows = rows.filter(r => r.d !== Infinity);
  let place = 0;
  answeredRows.forEach((r, i) => { if (i === 0 || r.d !== answeredRows[i - 1].d) place = i; const pts = answeredRows.length - place; sc[r.p.id].pts += pts; sc[r.p.id].time += r.t; r.pts = pts; });
  SFX.ok();
  overlay(`<div class="quiz reveal">${head}<div class="qtext small">${esc(nq.q)}</div>
    <div class="numans">Resposta: <b>${fmt(nq.a)}</b> ${esc(nq.unit)}</div>
    <div class="numrows">${rows.map((r, i) => `<div class="nr ${i === 0 && r.d !== Infinity ? 'best' : ''}" style="--pc:${r.p.color}"><span class="msav" style="background:${r.p.color}">${r.p.emoji}</span><b>${esc(r.p.name)}</b><span class="nrv">${r.v == null || isNaN(r.v) ? '—' : fmt(r.v)}</span><span class="nrd">${r.d === Infinity ? 'não respondeu' : r.d === 0 ? 'NA MOSCA! 🎯' : 'errou por ' + fmt(r.d)}</span><span class="nrp">${r.pts ? '+' + r.pts : ''}</span></div>`).join('')}</div></div>`, 'quizpanel');
  parts.forEach(p => { const r = rows.find(x => x.p === p); setUI(p, { screen: 'res', ok: r.d !== Infinity && r === rows[0], msg: r.d === Infinity ? '⏰ Não respondeu' : r.d === 0 ? '🎯 Na mosca!' : `Você chutou ${fmt(r.v)}`, sub: `Resposta: ${fmt(nq.a)} ${nq.unit}` + (r.pts ? ` · +${r.pts} pts` : '') }); });
  const best = rows[0];
  if (best && best.d !== Infinity) say(best.d === 0 ? `Na mosca! ${best.p.name} acertou em cheio: ${fmt(nq.a)}!` : `A resposta é ${fmt(nq.a)}! Quem chegou mais perto foi ${best.p.name}!`);
  else say(`A resposta era ${fmt(nq.a)}! Ninguém chutou?`);
  await sleep(T(4500));
}

async function roundResults(dyn, sc, parts) {
  const ranking = rankRound(sc, parts, dyn);
  const maxPlace = Math.max(...ranking.map(r => r.place));
  ranking.forEach(r => { r.reward = REWARDS[r.place - 1] ?? 1; });
  overlay(`<div class="results"><div class="wtitle">🏆 Resultado do quiz — ${DYNS[dyn].e} ${DYNS[dyn].n}</div>
    <div class="rrows">${ranking.map((r, i) => `<div class="rr" style="--pc:${r.p.color};animation-delay:${(ranking.length - i) * 0.25}s"><span class="rpl">${r.place}º</span><span class="msav" style="background:${r.p.color}">${r.p.emoji}</span><b>${esc(r.p.name)}</b>
      <span class="rpts">${dyn === 'speed' ? fmt(sc[r.p.id].pts) + ' pts' : dyn === 'number' ? sc[r.p.id].pts + ' pts' : sc[r.p.id].pts + ' acerto' + (sc[r.p.id].pts === 1 ? '' : 's')}</span>
      <span class="rrew">+${r.reward} 🪙</span><span class="ritem" id="ri-${r.p.id}"></span></div>`).join('')}</div></div>`, 'center');
  const win = ranking.filter(r => r.place === 1);
  await say(`Fim do quiz! ${win.length > 1 ? 'Empate no topo entre ' + win.map(w => w.p.name).join(' e ') : 'Quem venceu foi ' + win[0].p.name}! Todo mundo leva moedas de acordo com a colocação.`, { wait: true });
  ranking.forEach(r => addCoins(r.p, r.reward));
  await sleep(T(900));
  // 1º lugar escolhe item; último ganha item surpresa
  const picks = win.map(async r => {
    const p = r.p;
    if (p.items.length >= 3) { addCoins(p, 3); $('#ri-' + p.id) && ($('#ri-' + p.id).textContent = 'mochila cheia: +3 🪙'); return; }
    const choices = shuffle(ITEM_KEYS).slice(0, 3);
    const a = await ask(p, { screen: 'choose', title: '🏆 Você venceu! Escolha um item', opts: choices.map(k => ({ label: `${ITEMS[k].e} ${ITEMS[k].n}`, sub: ITEMS[k].d })) }, T(20000), { i: 0 }, '🎁');
    const k = choices[(a && a.i) || 0] || choices[0];
    giveItem(p, k); SFX.pop();
    const el = $('#ri-' + p.id); if (el) el.textContent = `${ITEMS[k].e} ${ITEMS[k].n}`;
  });
  G.players.filter(p => !win.some(w => w.p === p)).forEach(p => waitUI(p, '🏆 Vencedor escolhendo o item…'));
  if (maxPlace > 1) {
    ranking.filter(r => r.place === maxPlace).forEach(r => {
      const k = randomItemFor(r.p); const ok = giveItem(r.p, k);
      const el = $('#ri-' + r.p.id); if (el) el.textContent = ok ? `🎁 ${ITEMS[k].e} ${ITEMS[k].n}` : 'mochila cheia: +3 🪙';
    });
    const last = ranking.filter(r => r.place === maxPlace).map(r => r.p.name).join(' e ');
    say(`E ${last}, pra não ficar triste, ganha um item surpresa!`);
  }
  await Promise.all(picks);
  await sleep(T(2200));
}

    <div class="rest">${ranking.slice(3).map((p, i) => `<span class="rest1">${i + 4}º ${p.emoji} ${esc(p.name)} — ⭐ ${p.stars} · 🪙 ${p.coins}</span>`).join('')}</div>
    <button id="again" class="startbtn small">🔁 Jogar de novo</button></div>`, 'center');
  G.players.forEach(p => { const pl = rankOf(p); setUI(p, { screen: 'final', place: pl, stars: p.stars, coins: p.coins, msg: pl === 1 ? '🏆 VOCÊ VENCEU!' : pl === 2 ? '🥈 Segundo lugar!' : pl === 3 ? '🥉 Terceiro lugar!' : `${pl}º lugar` }); });
