const PH = { room: null, pid: null, name: '', emoji: '', joined: false, cur: { id: -1 }, me: null, dl: 0, pendingAct: null, taken: [], net: null, conn: false, tmr: null, lastMsg: 0 };

function phoneMain(room) {
  document.body.className = 'phone';
  document.body.innerHTML = `<div id="pbar"></div><div id="pmain"></div>`;
  phoneCore(room);
}

// opts.local: anfitrião do online (fala direto com o jogo) · opts.online: painel do modo online
function phoneCore(room, opts = {}) {
  PH.room = room.toUpperCase(); PH.online = !!(opts.online || opts.local); PH.isHost = !!opts.local;
  const ls = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  PH.pid = ls('qp_pid_' + LSX + PH.room) || uid();
  try { localStorage.setItem('qp_pid_' + LSX + PH.room, PH.pid); } catch (e) { }
  PH.name = ls('qp_name' + LSX) || '';
  PH.emoji = ls('qp_emoji' + LSX) || pick(AVATARS);
  if (opts.local) { PH.net = { send: m => setTimeout(() => onTVMsg(m), 0) }; PH.conn = true; }
  else PH.net = createTransport(PH.room, m => { if (m && m.t === 's') onPhoneMsg(m); else if (opts.onMsg) opts.onMsg(m); },
    st => { PH.conn = st === 'ok'; renderBar(); if (PH.conn) { PH.net.send({ t: 'hello', pid: PH.pid }); if (opts.onConnect) opts.onConnect(); } });
  const wasJoined = opts.local || ls('qp_joined_' + LSX + PH.room) === '1';
  if (wasJoined && PH.name) { PH.joined = true; sendJoin(); showMsg(opts.local ? '🎬 Abrindo a sala…' : '🔄 Conectando…', opts.local ? '' : 'Procurando ' + (PH.online ? 'o anfitrião' : 'a TV') + ' da sala ' + PH.room); }
  else renderJoin();
  setInterval(() => {
    if (PH.pendingAct && PH.pendingAct.uid === PH.cur.id) PH.net.send(PH.pendingAct.msg);
    else PH.pendingAct = null;
    if (PH.joined && !PH.me) sendJoin();
  }, 1300);
  setInterval(() => { if (PH.joined) PH.net.send({ t: 'hello', pid: PH.pid }); renderBar(); }, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { PH.net.send({ t: 'hello', pid: PH.pid }); keepAwake(); } });
}

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !document.hidden) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { } }

function sendJoin() { PH.net.send({ t: 'join', pid: PH.pid, name: PH.name, emoji: PH.emoji }); }

function renderJoin() {
  const main = $('#pmain');
  main.innerHTML = `<div class="pjoin">
    <div class="plogo">⭐ MONC'S<br>SHOW</div>
    <div class="proom">Sala <b>${esc(PH.room)}</b></div>
    <label class="plabel">Seu nome</label>
    <input id="nm" maxlength="14" placeholder="Digite seu nome" value="${esc(PH.name)}" autocomplete="off">
    <label class="plabel">Escolha seu personagem</label>
    <div id="avs" class="avs">${AVATARS.map(a => `<button class="av ${a === PH.emoji ? 'sel' : ''} ${PH.taken.includes(a) ? 'taken' : ''}" data-a="${a}">${a}</button>`).join('')}</div>
    <button id="go" class="pbig">ENTRAR NO SHOW 🎉</button>
  </div>`;
  $('#avs').onclick = e => { const b = e.target.closest('.av'); if (!b || b.classList.contains('taken')) return; PH.emoji = b.dataset.a; $('#avs').querySelectorAll('.av').forEach(x => x.classList.toggle('sel', x === b)); };
  $('#go').onclick = () => {
    const n = $('#nm').value.trim();
    if (!n) { $('#nm').focus(); $('#nm').classList.add('shake'); setTimeout(() => $('#nm').classList.remove('shake'), 500); return; }
    PH.name = n.slice(0, 14);
    try { localStorage.setItem('qp_name' + LSX, PH.name); localStorage.setItem('qp_emoji' + LSX, PH.emoji); localStorage.setItem('qp_joined_' + LSX + PH.room, '1'); } catch (e) { }
    PH.joined = true; keepAwake(); sendJoin();
    showMsg('⏳ Entrando…', PH.conn ? (PH.online ? 'Falando com o anfitrião' : 'Falando com a TV') : 'Conectando à sala…');
  };
}

function onPhoneMsg(m) {
  if (!m || m.t !== 's') return;
  PH.lastMsg = Date.now();
  PH.taken = m.taken || [];
  if (!PH.joined) {
    $('#avs') && $('#avs').querySelectorAll('.av').forEach(b => b.classList.toggle('taken', PH.taken.includes(b.dataset.a) && b.dataset.a !== PH.emoji));
    return;
  }
  const rj = m.rej && m.rej[PH.pid];
  const mine = m.ps && m.ps[PH.pid];
  if (!mine) {
    if (rj) {
      PH.joined = false; try { localStorage.removeItem('qp_joined_' + LSX + PH.room); } catch (e) { }
      const msgs = { full: 'A sala está cheia (8 jogadores).', started: PH.online ? 'A partida já começou. Dá para assistir pelo tabuleiro ao lado.' : 'A partida já começou sem você.', kicked: 'Você foi removido da sala.' };
      showMsg('🚫 Não deu para entrar', msgs[rj] || '', true);
    }
    return;
  }
  PH.me = mine.me; renderBar();
  const ui = mine.ui;
  if (ui && ui.id !== PH.cur.id) {
    PH.cur = ui; PH.pendingAct = null;
    PH.dl = ui.left != null ? Date.now() + ui.left : 0;
    renderPhoneUI(ui);
  }
}

function renderBar() {
  const b = $('#pbar'); if (!b) return;
  const me = PH.me;
  const stale = PH.lastMsg && Date.now() - PH.lastMsg > 9000;
  const dot = `<span class="pdot ${PH.conn && !stale ? 'ok' : 'bad'}"></span>`;
  if (!me) { b.innerHTML = `<div class="pb-l">${dot} Sala ${esc(PH.room || '')}</div>`; return; }
  b.style.setProperty('--pc', me.color);
  b.innerHTML = `<div class="pb-l">${dot}<span class="pbav" style="background:${me.color}">${me.emoji}</span><b>${esc(me.name)}</b></div>
    <div class="pb-r"><span>${me.rank}º</span><span>⭐ ${me.stars}</span><span>🪙 ${me.coins}</span><span class="pbi">${(me.items || []).map(k => ITEMS[k] ? ITEMS[k].e : '').join('')}</span></div>`;
}

function showMsg(msg, sub, err) {
  $('#pmain').innerHTML = `<div class="pwait ${err ? 'err' : ''}"><div class="pw-msg">${esc(msg)}</div>${sub ? `<div class="pw-sub">${esc(sub)}</div>` : ''}${err ? `<button class="pbig" onclick="location.reload()">Tentar de novo</button>` : ''}</div>`;
}

function act(a) {
  const msg = { t: 'act', pid: PH.pid, uid: PH.cur.id, a, el: Date.now() - (PH.shownAt || Date.now()) };
  PH.pendingAct = { uid: PH.cur.id, msg };
  PH.net.send(msg);
  try { navigator.vibrate && navigator.vibrate(30); } catch (e) { }
}

function timerHTML() { return PH.dl ? `<div class="ptimer"><div class="ptbar"></div></div>` : ''; }
function startTimerBar(total) {
  clearInterval(PH.tmr);
  const bar = $('.ptbar'); if (!bar || !PH.dl) return;
  const tot = total || Math.max(1, PH.dl - Date.now());
  const upd = () => { const left = PH.dl - Date.now(); bar.style.width = Math.max(0, Math.min(100, left / tot * 100)) + '%'; if (left <= 0) clearInterval(PH.tmr); };
  upd(); PH.tmr = setInterval(upd, 100);
}

function renderPhoneUI(ui) {
  clearInterval(PH.tmr);
  PH.shownAt = Date.now();
  const main = $('#pmain');
  const lock = () => main.querySelectorAll('button').forEach(b => b.disabled = true);
  switch (ui.screen) {
    case 'lobby':
      main.innerHTML = `<div class="pwait"><div class="pw-big" style="background:${PH.me.color}">${PH.me.emoji}</div><div class="pw-msg">Você está no show!</div><div class="pw-sub">${PH.isHost ? 'Você é o anfitrião!<br>Escolha o mapa e os turnos no tabuleiro e clique em <b>Começar o show</b>.' : PH.online ? 'Aguarde o anfitrião começar a partida.' : 'Aguarde a TV começar a partida.<br>Deixe o volume da TV alto 😄'}</div></div>`;
      break;
    case 'wait':
      main.innerHTML = `<div class="pwait"><div class="pw-msg">${esc(ui.msg || '')}</div>${ui.sub ? `<div class="pw-sub">${esc(ui.sub)}</div>` : ''}</div>`;
      break;
    case 'turn': {
      try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) { }
      main.innerHTML = `<div class="pturn"><div class="pt-t">🎲 SUA VEZ!</div>${timerHTML()}
        <button class="pbig roll" id="roll">${ui.dice > 1 ? '✌️ ROLAR 2 DADOS' : '🎲 ROLAR O DADO'}</button>
        ${ui.items && ui.items.length ? `<div class="pt-sub">ou use um item antes (1 por turno):</div><div class="plist">${ui.items.map(k => `<button class="pitem" data-k="${k}"><span class="pi-e">${ITEMS[k].e}</span><span><b>${ITEMS[k].n}</b><small>${ITEMS[k].d}</small></span></button>`).join('')}</div>` : ''}
      </div>`;
      $('#roll').onclick = () => { lock(); act({ a: 'roll' }); $('#roll').textContent = '🎲 Rolando…'; };
      main.querySelectorAll('.pitem').forEach(b => b.onclick = () => { lock(); act({ a: 'item', k: b.dataset.k }); });
      startTimerBar();
      break;
    }
    case 'pick':
      main.innerHTML = `<div class="pchoose"><div class="pc-t">${esc(ui.title)}</div>${ui.sub ? `<div class="pc-s">${esc(ui.sub)}</div>` : ''}${timerHTML()}
        <div class="plist">${ui.opts.map(o => `<button class="ppl" data-id="${o.id}" style="--pc:${o.color}"><span class="pbav" style="background:${o.color}">${o.emoji}</span><b>${esc(o.name)}</b><span class="ppl-s">⭐${o.stars} 🪙${o.coins}</span></button>`).join('')}</div>
        ${ui.cancel ? `<button class="pcancel" id="cx">Cancelar</button>` : ''}</div>`;
      main.querySelectorAll('.ppl').forEach(b => b.onclick = () => { lock(); b.classList.add('chosen'); act({ id: b.dataset.id }); });
      if (ui.cancel) $('#cx').onclick = () => { lock(); act({ cancel: true }); };
      startTimerBar();
      break;
    case 'choose':
      main.innerHTML = `<div class="pchoose"><div class="pc-t">${esc(ui.title)}</div>${ui.sub ? `<div class="pc-s">${esc(ui.sub)}</div>` : ''}${timerHTML()}
        <div class="plist ${ui.grid ? 'grid' : ''}">${ui.opts.map((o, i) => `<button class="popt ${o.color ? 'colored' : ''}" data-i="${i}" ${o.dis ? 'disabled' : ''} ${o.color ? `style="--bc:${o.color}"` : ''}><b>${esc(o.label)}</b>${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`).join('')}</div>
        ${ui.cancel ? `<button class="pcancel" id="cx">Cancelar</button>` : ''}</div>`;
      main.querySelectorAll('.popt').forEach(b => b.onclick = () => { lock(); b.classList.add('chosen'); act({ i: +b.dataset.i }); });
      if (ui.cancel) $('#cx').onclick = () => { lock(); act({ cancel: true }); };
      startTimerBar();
      break;
    case 'q': {
      const th = THEMES[ui.th] || { emoji: '', name: '' };
      main.innerHTML = `<div class="pq"><div class="pq-h"><span>${esc(ui.dyn)} · ${ui.n}/${ui.tot}</span><span>${th.emoji} ${esc(th.name)} · ${LEVEL_NAME[ui.lv] || ''}</span></div>
        <div class="pq-q">${esc(ui.q)}</div>${timerHTML()}
        <div class="pq-opts">${ui.opts.map((o, i) => `<button class="pqo" data-i="${i}" style="--oc:${OPT_COLORS[i]}"><span class="pqs">${OPT_SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <div id="fxl"></div></div>`;
      main.querySelectorAll('.pqo').forEach(b => b.onclick = () => { lock(); b.classList.add('chosen'); act({ i: +b.dataset.i }); });
      startTimerBar();
      const fx = ui.fx || {};
      if (fx.freeze) {
        lock();
        const ice = document.createElement('div'); ice.className = 'ice'; ice.innerHTML = `<div>🧊</div><div class="ice-n">3</div><div class="ice-t">Você foi congelado!</div>`;
        $('#fxl').appendChild(ice);
        let n = 3; const myId = ui.id;
        const iv = setInterval(() => { n--; if (PH.cur.id !== myId) { clearInterval(iv); return; } if (n <= 0) { clearInterval(iv); ice.remove(); main.querySelectorAll('.pqo').forEach(b => b.disabled = false); } else $('.ice-n', ice).textContent = n; }, 1000);
      }
      if (fx.ink) {
        const box = $('.pq-opts');
        for (let i = 0; i < 7; i++) {
          const s = document.createElement('div'); s.className = 'splat';
          s.style.left = (5 + Math.random() * 70) + '%'; s.style.top = (Math.random() * 75) + '%';
          s.style.width = s.style.height = (110 + Math.random() * 80) + 'px';
          s.style.transform = `rotate(${rnd(360)}deg)`;
          s.onclick = ev => { ev.stopPropagation(); s.classList.add('gone'); setTimeout(() => s.remove(), 250); };
          box.appendChild(s);
        }
        const tip = document.createElement('div'); tip.className = 'inktip'; tip.textContent = '🦑 Tinta! Toque nas manchas para limpar'; $('#fxl').appendChild(tip);
      }
      break;
    }
    case 'num': {
      let val = '';
      main.innerHTML = `<div class="pq"><div class="pq-h"><span>${esc(ui.dyn)} · ${ui.n}/${ui.tot}</span></div><div class="pq-q">${esc(ui.q)}</div>${timerHTML()}
        <div class="numdisp"><span id="nv">—</span> <small>${esc(ui.unit || '')}</small></div>
        <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'OK'].map(k => `<button class="key ${k === 'OK' ? 'ok' : ''}" data-k="${k}">${k}</button>`).join('')}</div></div>`;
      main.querySelector('.keypad').onclick = e => {
        const b = e.target.closest('.key'); if (!b || b.disabled) return;
        const k = b.dataset.k;
        if (k === '⌫') val = val.slice(0, -1);
        else if (k === 'OK') { if (!val) return; lock(); act({ v: Number(val) }); $('#nv').textContent = fmt(Number(val)) + ' ✓'; return; }
        else if (val.length < 7) val = (val + k).replace(/^0+(?=\d)/, '');
        $('#nv').textContent = val ? fmt(Number(val)) : '—';
      };
      startTimerBar();
      break;
    }
    case 'res':
      main.innerHTML = `<div class="pres ${ui.ok ? 'ok' : 'bad'}"><div class="pr-m">${esc(ui.msg)}</div><div class="pr-s">${esc(ui.sub || '')}</div></div>`;
      try { navigator.vibrate && navigator.vibrate(ui.ok ? 60 : [80, 50, 80]); } catch (e) { }
      break;
    case 'final':
      main.innerHTML = `<div class="pres final ${ui.place === 1 ? 'ok' : ''}"><div class="pr-big">${ui.place === 1 ? '🏆' : ui.place <= 3 ? ['', '', '🥈', '🥉'][ui.place] : '🎉'}</div><div class="pr-m">${esc(ui.msg)}</div><div class="pr-s">⭐ ${ui.stars} estrelas · 🪙 ${ui.coins} moedas</div><div class="pr-s">Valeu por jogar!</div></div>`;
      break;
    default:
      main.innerHTML = `<div class="pwait"><div class="pw-msg">…</div></div>`;
  }
}

/* =========================================================================
   INÍCIO
   ========================================================================= */
function homeMain() {
  document.body.className = 'phone home';
  let saved = null;
  try { const s = JSON.parse(localStorage.getItem('qp_tv') || 'null'); if (s && Date.now() - s.ts < 6 * 3600e3 && s.G && s.G.phase !== 'lobby' && !s.G.online) saved = s.G; } catch (e) { }
  document.body.innerHTML = `<div class="pjoin homebox">
    <div class="plogo">⭐ MONC'S<br>SHOW</div>
    <div class="psub">Jogo de tabuleiro + quiz para até 8 pessoas.<br>A TV mostra o show, cada um joga no celular.</div>
    <button class="pbig" id="tvbtn">📺 Abrir como TV (criar sala)</button>
    ${saved ? `<button class="pbig alt" id="resbtn">🔄 Continuar partida ${esc(saved.room)} (turno ${saved.turn})</button>` : ''}
    <div class="or">— ou —</div>
    <label class="plabel">Código da sala</label>
    <input id="code" maxlength="4" placeholder="ABCD" autocomplete="off" style="text-transform:uppercase;text-align:center;letter-spacing:.3em;font-size:28px">
    <button class="pbig alt" id="joinbtn">📱 Entrar pelo celular</button>
    <div class="or">— ou —</div>
    <button class="pbig online" id="onlinebtn">💻 Jogar online (cada um no seu computador)</button>
  </div>`;
  const keep = (LOCAL ? '&local' : '') + (FAST ? '&fast' : '');
  $('#tvbtn').onclick = () => { location.search = '?tv' + keep; };
  if (saved) $('#resbtn').onclick = () => { location.search = '?tv&resume' + keep; };
  $('#joinbtn').onclick = () => { const c = $('#code').value.trim().toUpperCase(); if (c.length === 4) location.search = '?sala=' + c + keep; };
  $('#onlinebtn').onclick = () => { location.search = '?online' + keep; };
}

window.addEventListener('DOMContentLoaded', () => {
  if (ONLINE) {
    if (PARAMS.has('host')) {
      let resume = null;
      if (PARAMS.has('resume')) { try { const s = JSON.parse(localStorage.getItem('qp_tv') || 'null'); if (s && s.G && s.G.online) resume = s.G; } catch (e) { } }
      onlineHostMain(resume);
    } else if (PARAMS.has('sala')) onlineClientMain(PARAMS.get('sala'));
    else onlineHomeMain();
    return;
  }
  if (PARAMS.has('sala')) phoneMain(PARAMS.get('sala'));
  else if (PARAMS.has('tv')) {
    let resume = null;
    if (PARAMS.has('resume')) { try { const s = JSON.parse(localStorage.getItem('qp_tv') || 'null'); if (s && s.G) resume = s.G; } catch (e) { } }
    tvMain(resume);
  } else homeMain();
});

</script>
<script>
'use strict';
/* =========================================================================
   MODO ONLINE — cada jogador no seu computador
   O anfitrião roda o jogo (igual à TV) e transmite a própria tela para os
   outros: as partes que mudam (tabuleiro, quiz, placar, apresentador) vão
   como HTML e cada computador aplica só a diferença; animações, sons e voz
   vão como eventos e cada computador reproduz localmente.
   ========================================================================= */
const MIRROR = { host: false, client: false, seq: 0, last: {}, timer: null, lastFull: 0, fullTimer: null, q: [] };
const MROOTS = ['lobby', 'turninfo', 'roomtag', 'plist', 'dicebox', 'ov', 'bubble', 'hl', 'traps', 'bankpot', 'starG', 'brG', 'prevG', 'tokens', 'stepsG'];

/* ---------- anfitrião ---------- */
// eventos (sons, voz, animações) vão agrupados na próxima atualização da tela: menos mensagens
function mFx(k, a) { if (!MIRROR.host || !net) return; MIRROR.q.push([k, a]); mSchedule(); }

function mSerialize(id) {
  const el = document.getElementById(id); if (!el) return null;
  let h = el.outerHTML;
  // o dado "girando" troca de número a cada 90 ms: cada computador gira o seu
  if (id === 'dicebox') h = h.replace(/(<div class="die rolling">)[^<]*(<\/div>)/g, '$1?$2');
  return h;
}
function mFlush(full) {
  clearTimeout(MIRROR.timer); MIRROR.timer = null;
  if (!MIRROR.host || !net) return;
  const roots = {}; let any = false;
  for (const id of MROOTS) {
    const h = mSerialize(id); if (h == null) continue;
    if (full || MIRROR.last[id] !== h) { roots[id] = h; MIRROR.last[id] = h; any = true; }
  }
  const mode = $('#stage').className, hc = ($('#host') || {}).className || '';
  const fx = MIRROR.q; MIRROR.q = [];
  if (!full && !any && !fx.length && mode === MIRROR.last._mode && hc === MIRROR.last._hc) return;
  MIRROR.last._mode = mode; MIRROR.last._hc = hc;
  net.send({ t: 'm', seq: ++MIRROR.seq, full: !!full, map: MAP_ID, mode, hc, roots, fx });
}
function mSchedule() { if (!MIRROR.timer) MIRROR.timer = setTimeout(() => mFlush(false), 100); }
function mFullReq() {
  if (!MIRROR.host) return;
  const wait = 400 - (Date.now() - MIRROR.lastFull);
  if (wait > 0) { if (!MIRROR.fullTimer) MIRROR.fullTimer = setTimeout(() => { MIRROR.fullTimer = null; mFullReq(); }, wait); return; }
  MIRROR.lastFull = Date.now(); mFlush(true);
}
function mirrorHostStart() {
  MIRROR.host = true;
  const fx = $('#fx');
  new MutationObserver(recs => { for (const r of recs) if (!fx.contains(r.target)) { mSchedule(); return; } })
    .observe($('#stage'), { subtree: true, childList: true, attributes: true, characterData: true });
  // sons do anfitrião tocam em todos os computadores
  SFX._o = {};
  ['step', 'coin', 'lose', 'dice', 'pop', 'ok', 'bad', 'tick', 'fanfare', 'evil', 'whoosh'].forEach(n => {
    const o = SFX[n]; SFX._o[n] = o;
    SFX[n] = function (...a) { mFx('sfx', [n]); return o.apply(this, a); };
  });
}

/* ---------- convidados ---------- */
function mReq() { if (PH.net) PH.net.send({ t: 'mreq', pid: PH.pid }); }

function mParse(live, html) {
  const tpl = document.createElement('template');
  if (live instanceof SVGElement && !(live instanceof SVGSVGElement)) {
    tpl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg">${html}</svg>`;
    return tpl.content.firstChild && tpl.content.firstChild.firstElementChild;
  }
  tpl.innerHTML = html;
  return tpl.content.firstElementChild;
}
const keepsStyle = el => el.nodeType === 1 && (el.getAttribute('data-keep') || '').includes('style');
function mPrep(n) {   // elemento novo: tira o estilo que cada computador controla sozinho
  if (n.nodeType === 1) [n, ...n.querySelectorAll('[data-keep]')].forEach(e => { if (keepsStyle(e)) e.removeAttribute('style'); });
  return n;
}
// aplica em `a` (na tela) as diferenças de `b` (recebido), preservando os elementos
// que já existem — assim as animações e transições continuam rodando
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(mPrep(b)); return; }
  if (a.nodeType !== 1) { if (a.data !== b.data) a.data = b.data; return; }
  const ks = keepsStyle(a);
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name) && !(ks && at.name === 'style')) a.removeAttribute(at.name);
  for (const at of [...b.attributes]) { if (ks && at.name === 'style') continue; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
  const key = n => (n.nodeType === 1 ? n.getAttribute('data-p') || n.id || null : null);
  const oldC = [...a.childNodes], newC = [...b.childNodes];
  const keyed = new Map(); oldC.forEach(n => { const k = key(n); if (k) keyed.set(k, n); });
  const free = oldC.filter(n => !key(n)); let fi = 0;
  newC.forEach((nb, i) => {
    const k = key(nb); let na = null;
    if (k) na = keyed.get(k) || null;
    else if (fi < free.length && free[fi].nodeType === nb.nodeType && free[fi].nodeName === nb.nodeName) na = free[fi++];
    const ref = a.childNodes[i] || null;
    if (na) { if (na !== ref) a.insertBefore(na, ref); morph(na, nb); }
    else a.insertBefore(mPrep(nb), ref);
  });
  while (a.childNodes.length > newC.length) a.removeChild(a.lastChild);
}

function onMirror(m) {
  if (m.map && m.map !== MAP_ID) { loadMap(m.map); buildBoardSVG(); if (!m.full) mReq(); }
  if (!m.full && MIRROR.seq && m.seq !== MIRROR.seq + 1) mReq();   // perdeu alguma atualização
  MIRROR.seq = m.seq;
  if (m.mode) $('#stage').className = m.mode;
  const he = $('#host'); if (he && m.hc != null) he.className = m.hc;
  for (const [id, html] of Object.entries(m.roots || {})) {
    const el = document.getElementById(id); if (!el) continue;
    const before = id === 'bubble' ? el.textContent : null;
    const nb = mParse(el, html); if (!nb) continue;
    morph(el, nb);
    if (id === 'bubble' && el.textContent !== before) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  (m.fx || []).forEach(([k, a]) => onFx({ k, a }));
}

function clientSpeak(text) {
  if (FAST || Voice.muted || !('speechSynthesis' in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR'; if (Voice.voice) u.voice = Voice.voice; u.rate = 1.08; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) { }
}
const FXH = {
  coinFlight: (from, to, count) => coinFlight(from, to, count),
  burst: (xy, chars, n, spread, cls) => burst(xy, chars, n, spread, cls),
  flash: (xy, cls) => flash(xy, cls),
  floatAt: (x, y, text, color) => floatAt(x, y, text, color),
  arc: moves => arcTokens(moves.map(m => ({ p: { id: m.id }, from: m.from, to: m.to }))),
  sfx: n => { if (typeof SFX[n] === 'function') SFX[n](); },
  say: text => clientSpeak(text),
  wheel: (final, dur) => {
    let tries = 0;
    const go = () => {
      const g = $('#wheelG');
      if (!g) { if (tries++ < 60) setTimeout(go, 50); return; }
      g.style.transition = 'none'; g.style.transform = 'rotate(0deg)'; void g.getBoundingClientRect();
      requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transition = `transform ${dur}ms cubic-bezier(.12,.75,.12,1)`; g.style.transform = `rotate(${final}deg)`; }));
    };
    go();
  },
};
function onFx(m) { const h = FXH[m.k]; if (h) try { h(...(m.a || [])); } catch (e) { console.warn('fx', m.k, e); } }

/* ---------- telas do modo online ---------- */
function onlineShell(isHost) {
  document.body.className = 'online ' + (isHost ? 'host' : 'client');
  document.body.innerHTML = `<div id="stagebox"></div>
    <aside id="opanel">
      <div class="ohead"><span class="ologo">⭐ MONC'S SHOW <small>online</small></span>
        <span><button id="ovoice" class="mini" title="Voz do apresentador">🔊</button><button id="osfx" class="mini" title="Efeitos sonoros">🎵</button></span></div>
      <div id="pbar"></div><div id="pmain"></div>
    </aside>
    <div id="soundgate"><div class="sg-box"><div class="sg-e">🔊</div><div class="sg-t">Clique para entrar no show</div><div class="sg-s">O navegador só libera o som e a voz do apresentador depois de um clique.</div></div></div>`;
  $('#ovoice').onclick = () => { Voice.muted = !Voice.muted; $('#ovoice').textContent = Voice.muted ? '🔇' : '🔊'; if (Voice.muted) try { speechSynthesis.cancel(); } catch (e) { } };
  $('#osfx').onclick = () => { SFX.on = !SFX.on; $('#osfx').style.opacity = SFX.on ? 1 : 0.4; };
  $('#soundgate').onclick = () => {
    SFX.init();
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { }
    $('#soundgate').remove();
  };
  if (FAST) $('#soundgate').remove();
  const ro = new ResizeObserver(() => fitStage()); ro.observe($('#stagebox'));
}

function onlineHostMain(resume) {
  onlineShell(true);
  tvMain(resume, { container: $('#stagebox'), online: true });
  mirrorHostStart();
  phoneCore(G.room, { local: true });
  requestAnimationFrame(fitStage);
}

function onlineClientMain(room) {
  onlineShell(false);
  buildTV($('#stagebox'));
  Voice.init();
  MIRROR.client = true;
  // o dado girando é animado localmente
  setInterval(() => document.querySelectorAll('#dicebox .die.rolling').forEach(d => { d.textContent = 1 + rnd(10); }), 90);
  phoneCore(room, { online: true, onMsg: m => { if (m.t === 'm') onMirror(m); else if (m.t === 'fx') onFx(m); }, onConnect: mReq });
  requestAnimationFrame(fitStage);
}

function onlineHomeMain() {
  document.body.className = 'phone home';
  const ls = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  let saved = null;
  try { const s = JSON.parse(ls('qp_tv') || 'null'); if (s && Date.now() - s.ts < 6 * 3600e3 && s.G && s.G.online && s.G.phase !== 'lobby') saved = s.G; } catch (e) { }
  let emoji = ls('qp_emoji' + LSX) || pick(AVATARS);
  document.body.innerHTML = `<div class="pjoin homebox onlinehome">
    <div class="plogo">⭐ MONC'S<br>SHOW</div>
    <div class="psub">💻 <b>Modo online</b>: cada um joga no seu computador e todos veem o mesmo tabuleiro.<br>Dica: abram uma chamada no Discord para conversar.</div>
    <label class="plabel">Seu nome</label>
    <input id="nm" maxlength="14" placeholder="Digite seu nome" value="${esc(ls('qp_name' + LSX) || '')}" autocomplete="off">
    <label class="plabel">Escolha seu personagem</label>
    <div id="avs" class="avs">${AVATARS.map(a => `<button class="av ${a === emoji ? 'sel' : ''}" data-a="${a}">${a}</button>`).join('')}</div>
    <button class="pbig" id="hostbtn">🎬 Criar sala (sou o anfitrião)</button>
    ${saved ? `<button class="pbig alt" id="resbtn">🔄 Continuar partida ${esc(saved.room)} (turno ${saved.turn})</button>` : ''}
    <div class="or">— ou —</div>
    <label class="plabel">Código da sala</label>
    <input id="code" maxlength="4" placeholder="ABCD" autocomplete="off" style="text-transform:uppercase;text-align:center;letter-spacing:.3em;font-size:28px">
    <button class="pbig alt" id="joinbtn">🚪 Entrar na sala</button>
    <a class="backlink" id="backlink" href="#">← Voltar para o modo TV + celular</a>
  </div>`;
  const keep = (LOCAL ? '&local' : '') + (FAST ? '&fast' : '') + (LSX ? '&p=' + LSX : '');
  $('#avs').onclick = e => { const b = e.target.closest('.av'); if (!b) return; emoji = b.dataset.a; $('#avs').querySelectorAll('.av').forEach(x => x.classList.toggle('sel', x === b)); };
  const saveMe = () => {
    const n = $('#nm').value.trim();
    if (!n) { $('#nm').focus(); $('#nm').classList.add('shake'); setTimeout(() => $('#nm').classList.remove('shake'), 500); return false; }
    try { localStorage.setItem('qp_name' + LSX, n.slice(0, 14)); localStorage.setItem('qp_emoji' + LSX, emoji); } catch (e) { }
    return true;
  };
  $('#hostbtn').onclick = () => { if (saveMe()) location.search = '?online&host' + keep; };
  if (saved) $('#resbtn').onclick = () => { location.search = '?online&host&resume' + keep; };
  $('#joinbtn').onclick = () => {
    const c = $('#code').value.trim().toUpperCase();
    if (c.length !== 4) { $('#code').focus(); return; }
    if (!saveMe()) return;
    try { localStorage.setItem('qp_joined_' + LSX + c, '1'); } catch (e) { }
    location.search = '?online&sala=' + c + keep;
  };
  $('#backlink').onclick = e => { e.preventDefault(); location.search = (LOCAL ? '?local' : '') + (FAST ? (LOCAL ? '&fast' : '?fast') : ''); };
}

</script>
